  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens and shape as pest-plant-header.html */
    :root {
      --navy:       #1f2e35;
      --bg:         #f4f0ef;
      --surface:    #ffffff;
      --border:     #ddddd8;
      --muted:      #5a5a52;
      --caption:    #888880;
      --forest:     #2d6a4f;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 10px 16px;
      overflow: hidden;
    }

    .title-block {
      flex: 0 0 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--forest);
    }

    h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .period { font-size: 0.78rem; color: var(--muted); }

    .tiles {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-width: 0;
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      padding: 8px 14px;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto auto;
      column-gap: 18px;
      row-gap: 3px;
      align-content: center;
      min-width: 0;
    }

    .tile-label {
      grid-column: 1 / -1;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caption);
      white-space: nowrap;
    }

    .tile-val {
      font-size: 1.75rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tile-prev { grid-column: 1; font-size: 0.72rem; color: var(--caption); white-space: nowrap; }

    /* Breakdown beside the big number: trap types, or catches by species */
    .tile-parts {
      grid-column: 2;
      grid-row: 2 / 4;
      align-self: center;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 12px;
      font-size: 0.76rem;
      color: var(--muted);
      min-width: 0;
    }

    .tile-parts b { font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }

    <span class="eyebrow">Tōtara Reserve</span>
    <h1>Pest Animal Control</h1>
    <span class="period" id="period"></span>
  </div>

  <div class="tiles" id="tiles"></div>

<script>
(function () {
  const D = PCO_DATA;
  if (!D) return;

  const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-NZ');
  const MUSTELIDS = ['Stoat', 'Weasel', 'Ferret'];

  // Report the last completed FY (the current one is still filling up), falling
  // back to the newest FY in the data if that one is missing.
  const C = D.catchesByFy || { labels: [], species: [], data: {} };
  const gen = new Date(D.generated);
  const start = (gen.getMonth() >= 6 ? gen.getFullYear() : gen.getFullYear() - 1) - 1;
  const wanted = `${String(start).slice(2)}-${String(start + 1).slice(2)}`;
  const fi = C.labels.includes(wanted) ? C.labels.indexOf(wanted) : C.labels.length - 1;
  const fy = C.labels[fi];
  const prevFy = fi > 0 ? C.labels[fi - 1] : null;

  const totalFor = i => C.species.reduce((s, sp) => s + ((C.data[sp] || [])[i] || 0), 0);
  const bySpecies = i => {
    const out = {};
    for (const sp of C.species) {
      const name = MUSTELIDS.includes(sp) ? 'Mustelids' : sp;
      out[name] = (out[name] || 0) + ((C.data[sp] || [])[i] || 0);
    }
    return Object.entries(out).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  };

  document.getElementById('period').textContent =
    fy ? `Financial year 20${fy.slice(0, 2)}-${fy.slice(3)}` : '';

  const T = (D.bioTotara || {}).byType || { labels: [], data: [] };
  const trapParts = T.labels.map((l, i) => `<span>${l} <b>${fmt(T.data[i])}</b></span>`).join('');
  const catchParts = fy ? bySpecies(fi).map(([sp, n]) => `<span>${sp} <b>${fmt(n)}</b></span>`).join('') : '';

  document.getElementById('tiles').innerHTML = `
    <div class="tile">
      <span class="tile-label">Traps</span>
      <span class="tile-val">${fmt((D.bioTotara || {}).total)}</span>
      <span class="tile-prev">reserve plus 200 m buffer</span>
      <div class="tile-parts">${trapParts}</div>
    </div>
    <div class="tile">
      <span class="tile-label">Animals caught${fy ? ' · ' + fy : ''}</span>
      <span class="tile-val">${fy ? fmt(totalFor(fi)) : '–'}</span>
      <span class="tile-prev">${prevFy ? `${fmt(totalFor(fi - 1))} in ${prevFy}` : '&nbsp;'}</span>
      <div class="tile-parts">${catchParts}</div>
    </div>`;
})();
</script>
