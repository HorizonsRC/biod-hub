    :root {

      --muted:      #5a5a52;

      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 10px 16px;
      overflow: hidden;
    }

    .title-block {
      flex: 0 0 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--forest);
    }

      font-family: 'Source Serif 4', serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .period { font-size: 0.78rem; color: var(--muted); }

    .tiles {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-width: 0;
    }

    .tile-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caption);
      white-space: nowrap;
    }

    .tile-val {
      font-size: 1.75rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tile-val small { font-size: 0.8rem; color: var(--muted); font-weight: 400; margin-left: 2px; }

    .tile-prev { font-size: 0.72rem; color: var(--caption); white-space: nowrap; }

<body>

  <div class="title-block">
    <span class="eyebrow">Tōtara Reserve</span>
    <h1>Pest Animal Control</h1>
    <span class="period" id="period"></span>
  </div>

  <div class="tiles" id="tiles"></div>

<script>
(function () {
  const D = PCO_DATA;
  if (!D) return;

  const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-NZ');

  // Report the last completed FY (the current one is still filling up).
  const gen = new Date(D.generated);
  const start = (gen.getMonth() >= 6 ? gen.getFullYear() : gen.getFullYear() - 1) - 1;
  const FY = `${String(start).slice(2)}-${String(start + 1).slice(2)}`;
  const PREV = `${String(start - 1).slice(2)}-${String(start).slice(2)}`;

  document.getElementById('period').textContent = `Financial year 20${FY.slice(0, 2)}-${FY.slice(3)}`;

  // Value for one FY from a {labels, data} series, or null if the FY is absent
  const at = (series, fy, pick) => {
    const i = (series && series.labels || []).indexOf(fy);
    return i < 0 ? null : pick(i);
  };

  const C = D.catchesByFy || {};
  const caught = fy => at(C, fy, i => (C.species || []).reduce((s, sp) => s + ((C.data[sp] || [])[i] || 0), 0));

  const T = D.trapChecksByFy || {};
  const checks = fy => at(T, fy, i => T.data[i]);

  const F = (D.possumBait || {}).fills || {};
  const fills = fy => at(F, fy, i => Object.values(F.fillCounts || {}).reduce((s, arr) => s + (arr[i] || 0), 0));

  // Share of fill visits where some or all bait had been taken
  const B = (D.possumBait || {}).baitRemaining || {};
  const take = fy => at(B, fy, i => {
    const n = B.all[i] + B.half[i] + B.none[i];
    return n ? Math.round((B.half[i] + B.none[i]) / n * 100) : null;
  });

  const tti = D.tti && D.tti.history;
  const nT = tti ? tti.dates.length : 0;
  const month = d => new Date(d).toLocaleDateString('en-NZ', { month: 'short', year: 'numeric' });

  const TILES = [
    { label: 'Animals caught',  v: caught(FY), p: caught(PREV) },
    { label: 'Trap checks',     v: checks(FY), p: checks(PREV) },
    { label: 'Bait fills',      v: fills(FY),  p: fills(PREV) },
    { label: 'Bait take',       v: take(FY),   p: take(PREV), unit: '%' },
    { label: nT ? `Rat TTI · ${month(tti.dates[nT - 1])}` : 'Rat TTI',
      v: nT ? tti.rat[nT - 1] : null,
      unit: '%',
      prevText: nT > 1 ? `${fmt(tti.rat[nT - 2])}% in ${month(tti.dates[nT - 2])}` : null },
  ];

  document.getElementById('tiles').innerHTML = TILES.map(t => {
    const unit = t.unit || '';
    const prev = t.prevText || (t.p == null ? null : `${fmt(t.p)}${unit} in ${PREV}`);
    return `<div class="tile">
      <span class="tile-label">${t.label}</span>
      <span class="tile-val">${fmt(t.v)}<small>${unit}</small></span>
      <span class="tile-prev">${prev || '&nbsp;'}</span>
    </div>`;
  }).join('');
})();
</script>
