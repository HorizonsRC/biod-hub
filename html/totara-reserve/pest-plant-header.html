  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens as predator-control.html */
    :root {
      --navy:       #222222;
      --bg:         #f0f0f0;
      --surface:    #ffffff;
      --border:     #dcdcdc;
      --muted:      #515151;
      --caption:    #8a8a8a;
      --forest:     #047f67;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 10px 16px;
      overflow: hidden;
    }

    .title-block {
      flex: 0 0 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--forest);
    }

    h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .period { font-size: 0.78rem; color: var(--muted); }
    .period .lag { color: var(--caption); font-style: italic; }

    .tiles {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-width: 0;
    }

    .tile-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caption);
      white-space: nowrap;
    }

    .tile-val {
      font-size: 1.75rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tile-val small { font-size: 0.8rem; color: var(--muted); font-weight: 400; margin-left: 2px; }

    .tile-prev { font-size: 0.72rem; color: var(--caption); white-space: nowrap; }
  </style>

  <div class="title-block">
    <span class="eyebrow">Tōtara Reserve</span>
    <h1>Pest Plant Control</h1>
    <span class="period" id="period"></span>
  </div>

  <div class="tiles" id="tiles"></div>

<script>
(function () {
  const D = PEST_PLANT_DATA;
  if (!D) return;

  const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-NZ');
  // "▲ up from 162 in 24-25": says outright that the big number is the newer one
  const trend = (v, p, text) => v == null || p == null ? text
    : (v > p ? '▲ up from ' : v < p ? '▼ down from ' : 'same as ') + text;
  const cur  = D.current;
  const idx  = D.byFy.findIndex(r => r.fy === D.fy);
  const prev = idx > 0 ? D.byFy[idx - 1] : null;

  // When the finished year's contractor data is not in yet, say so rather than
  // letting the older year pass as current.
  document.getElementById('period').innerHTML =
    `Financial year ${D.fyLabel}` +
    (D.fyWanted && D.fyWanted !== D.fy ? `<br><span class="lag">${D.fyWanted} data not yet received</span>` : '');

  const TILES = [
    { label: 'Weed records',  key: 'records',       unit: '' },
    { label: 'Species',       key: 'species',       unit: '' },
    { label: 'Area of weed',  key: 'areaSqm',       unit: 'm²' },
    { label: 'Tracks walked', key: 'km',            unit: 'km', round: true },
    { label: 'Controlled',    key: 'controlledPct', unit: '%' },
  ];

  document.getElementById('tiles').innerHTML = TILES.map(t => {
    const v = t.round ? Math.round(cur[t.key]) : cur[t.key];
    const p = prev ? (t.round ? Math.round(prev[t.key]) : prev[t.key]) : null;
    return `<div class="tile">
      <span class="tile-label">${t.label}</span>
      <span class="tile-val">${fmt(v)}<small>${t.unit}</small></span>
      <span class="tile-prev">${p == null ? '&nbsp;' : trend(v, p, `${fmt(p)}${t.unit === '%' ? '%' : ''} in ${prev.fy}`)}</span>
    </div>`;
  }).join('');
})();
</script>
</body>
</html>
