  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens as predator-control.html */
    :root {
      --navy:       #222222;
      --bg:         #f0f0f0;
      --surface:    #ffffff;
      --border:     #dcdcdc;
      --muted:      #515151;
      --caption:    #8a8a8a;
      --forest:     #047f67;
      --forest-lt:  #e2f1ed;
      --lime:       #86be3d;   /* the website's "Book online" green */
      --unsafe:     #9b2226;

      --inat:       var(--forest);
      --ebird:      var(--lime);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      padding: 12px 16px 8px;
    }

    /* ── LAYOUT: one embed filling the whole ExB page, 1111 × 687 ── */
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .head {
      display: flex;
      gap: 12px;
      flex: 0 0 92px;
    }

    .title-block {
      flex: 0 0 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--forest);
    }

    /* Back link to the app's Main Page */
    a.eyebrow { text-decoration: none; align-self: flex-start; }
    a.eyebrow:hover { text-decoration: underline; }

    h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .period { font-size: 0.78rem; color: var(--muted); }

    .tiles {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .tile, .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      min-width: 0;
    }

    .tile {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .tile-label, .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tile-label { color: var(--caption); }

    .tile-val {
      font-size: 1.75rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .tile-sub { font-size: 0.72rem; color: var(--caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .cols {
      flex: 1;
      display: grid;
      grid-template-columns: 1.12fr 1fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

    .card {
      padding: 11px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .card.grow { flex: 1; }

    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .badge { color: var(--forest); }
    .card-meta { font-size: 0.72rem; color: var(--caption); white-space: nowrap; }

    .sub-label { font-size: 0.76rem; color: var(--caption); }

    .note {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
      padding-top: 7px;
      border-top: 1px solid var(--border);
    }

    /* Lists that fill the space they are given. trimToFit() drops whole rows
       from the end rather than letting the card cut one in half. */
    .fill { flex: 1; min-height: 0; overflow: hidden; }

    /* ── BIRDS ── */
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.74rem; color: var(--muted); }
    /* Direct children only — the E / ! marks inside are spans too */
    .legend > span { display: inline-flex; align-items: center; gap: 5px; }
    .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .bird-list { display: flex; flex-direction: column; justify-content: space-between; }

    .bird {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px 24px;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      line-height: 1.2;
      min-height: 14px;
    }

    .more { font-size: 0.72rem; color: var(--caption); font-style: italic; }

    .bird-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bird-name b { font-weight: 600; }
    .bird-name .en { color: var(--caption); margin-left: 4px; }

    .mark {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      line-height: 13px;
      width: 13px;
      text-align: center;
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: 1px;
    }
    .mark.e { color: var(--forest); border: 1px solid var(--forest); }
    .mark.t { color: #fff; background: var(--unsafe); }

    .stack { display: flex; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .stack i { display: block; height: 100%; }
    .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    .intro-line {
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .intro-line.one { -webkit-line-clamp: 1; }
    .intro-line b { color: var(--navy); font-weight: 600; }

    .info {
      margin-left: auto;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid var(--caption);
      color: var(--caption);
      font-size: 9px;
      font-weight: 700;
      font-style: italic;
      font-family: Georgia, serif;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      cursor: help;
    }

    /* Bird card tabs: species recorded / five-minute bird counts */
    .tabs { display: flex; gap: 4px; flex-shrink: 0; }
    .tab {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 10px;
      cursor: pointer;
    }
    .tab:hover { border-color: var(--forest); }
    .tab.on { color: #fff; background: var(--forest); border-color: var(--forest); }

    /* ── FIVE-MINUTE BIRD COUNTS ── */
    :root { --intro: #b9b9b9; }

    .mbc-chart { display: flex; align-items: stretch; gap: 4px; height: 112px; flex-shrink: 0; }
    .mbc-year { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .mbc-val { font-size: 0.68rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mbc-bar { flex: 1; width: 70%; display: flex; flex-direction: column; justify-content: flex-end; }
    .mbc-bar i { display: block; width: 100%; }
    .mbc-bar i.n { background: var(--forest); opacity: 0.85; border-radius: 0 0 2px 2px; }
    .mbc-bar i.x { background: var(--intro); border-radius: 2px 2px 0 0; }
    .mbc-lbl { font-size: 0.68rem; color: var(--caption); }

    /* ── iNATURALIST GROUP CARDS ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stats.three { grid-template-columns: repeat(3, 1fr); }
    .stat { background: var(--bg); border-radius: 5px; padding: 3px 8px 4px; min-width: 0; }
    .stat-val { font-size: 1.05rem; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 0.66rem; color: var(--muted); white-space: nowrap; }

    .top-list { display: flex; flex-direction: column; gap: 3px; }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px 22px;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
    }
    .top-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    .top-name.sci { font-style: italic; }
    .bar { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--forest); opacity: 0.75; border-radius: 4px; }

    /* Small enough that six pills usually sit on one row */
    .threat-list { display: flex; flex-wrap: wrap; gap: 3px; flex-shrink: 0; }
    .threat {
      font-size: 0.62rem;
      line-height: 1.3;
      border: 1px solid #e3c4c5;
      background: #fbf3f3;
      color: var(--navy);
      border-radius: 9px;
      padding: 0 5px;
      white-space: nowrap;
    }
    .threat em { font-style: normal; color: var(--unsafe); }

    .photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }
    /* Fixed height, not an aspect ratio: on a wide screen the columns widen, and
       photos that grew with them took the room the "Most recorded" lists need. */
    .photo {
      position: relative;
      display: block;
      height: 66px;
      border-radius: 5px;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      text-decoration: none;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo span {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 10px 5px 3px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
      font-size: 9.5px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .photo span small { display: block; font-size: 8px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; }

    /* ── BATS ── */
    .bat-top { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; align-items: center; }
    .bat-clock svg { width: 118px; height: 118px; display: block; }
    .bat-big { display: flex; align-items: baseline; gap: 6px; }
    .bat-big b { font-size: 1.9rem; font-weight: 300; line-height: 1; }
    .bat-big span { font-size: 0.78rem; color: var(--muted); }
    .bat-sp { font-size: 0.86rem; font-weight: 600; margin-top: 3px; }
    .bat-sp i { font-weight: 400; color: var(--caption); font-style: normal; }
    .bat-facts { font-size: 0.74rem; color: var(--muted); line-height: 1.5; margin-top: 4px; }

    .nights { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .night-bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; }
    .night-bars i { flex: 1; background: var(--forest); opacity: 0.75; border-radius: 2px 2px 0 0; min-height: 1px; }
    .night-bars i.zero { background: var(--border); opacity: 1; }
    .night-axis { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--caption); }

    /* ── FOOTER ── */
    .dash-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--caption);
      gap: 4px;
      flex: 0 0 auto;
    }
  </style>

    /* BIO_DATA_END */

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const FULL_MONTHS = ['January','February','March','April','May','June','July',
                         'August','September','October','November','December'];
    const fmt = n => Number(n).toLocaleString('en-NZ');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // 'YYYY-MM-DD' read as a local date, not UTC midnight
    const day = iso => new Date(iso + 'T00:00:00');
    const dayMon = iso => { const d = day(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

    // ── Birds ─────────────────────────────────────────────────────────────────
    function birdRow(s, max) {
      const total = s.inat + s.ebird;
      const name = s.mi
        ? `<b>${esc(s.mi)}</b><span class="en">${esc(s.name)}</span>`
        : `<b>${esc(s.name)}</b>`;
      const marks = (s.status === 'endemic' ? '<span class="mark e" title="Endemic — found only in New Zealand">E</span>' : '')
        + (s.threat ? `<span class="mark t" title="${esc(s.threat)}">!</span>` : '');
      const tip = `${s.mi ? s.mi + ' · ' : ''}${s.name} (${s.sci}): ${s.inat} iNaturalist, ${s.ebird} eBird`
        + (s.threat ? ` · ${s.threat}` : '');
      return `
        <div class="bird" title="${esc(tip)}">
          <span class="bird-name">${name}${marks}</span>
          <span class="stack">
            <i style="width:${s.inat / max * 100}%;background:var(--inat)"></i>
            <i style="width:${s.ebird / max * 100}%;background:var(--ebird)"></i>
          </span>
          <span class="num">${total}</span>
        </div>`;
    }

    // Which tab the bird card shows. Kept outside render(), which rebuilds the
    // page on every resize. #counts in the URL opens the bird counts tab.
    let birdTab = location.hash === '#counts' ? 'counts' : 'species';

    function birdTabs(mbc) {
      if (!mbc) return '';
      return `<div class="tabs">${[['species', 'Species recorded'], ['counts', 'Bird counts']].map(([k, label]) =>
        `<button class="tab${birdTab === k ? ' on' : ''}" data-bird-tab="${k}">${label}</button>`).join('')}</div>`;
    }

    function birdCard(b, mbc) {
      if (mbc && birdTab === 'counts') return mbcCard(mbc);
      const native = b.species.filter(s => s.status !== 'introduced');
      const intro  = b.species.filter(s => s.status === 'introduced');
      const max = Math.max(...native.map(s => s.inat + s.ebird), 1);
      const threatened = native.filter(s => s.threat);
      const hotspots = (b.hotspots || []).join(' and ');
      return `
        <div class="card grow">
          ${birdTabs(mbc)}
          <div class="card-head">
            <span class="badge">Native birds &middot; eBird + iNaturalist</span>
            <span class="card-meta">${native.length} species</span>
          </div>
          <div class="legend">
            <span><i class="sw" style="background:var(--inat)"></i>iNaturalist</span>
            <span><i class="sw" style="background:var(--ebird)"></i>eBird</span>
            <span><span class="mark e" style="margin:0">E</span>endemic</span>
            ${threatened.length ? '<span><span class="mark t" style="margin:0">!</span>threatened</span>' : ''}
            <span class="info" title="How birds are counted: sightings, not birds. Each iNaturalist observation and each eBird checklist naming the species counts once.${hotspots ? '&#10;eBird hotspots: ' + esc(hotspots) + '.' : ''}">i</span>
          </div>
          <div class="bird-list fill" data-trim data-more="native species">${native.map(s => birdRow(s, max)).join('')}</div>
          ${threatened.length ? `<div class="intro-line one">${threatened.map(s =>
            `<b>${esc(s.mi || s.name)}</b> ${s.mi ? '(' + esc(s.name.toLowerCase()) + ') ' : ''}is ${esc(s.threat)}.`).join(' ')}</div>` : ''}
          ${intro.length ? `<div class="intro-line one" title="${esc(intro.map(s => s.name).join(', '))}"><b>Also ${intro.length} introduced species:</b>
            ${intro.map(s => esc(s.name.toLowerCase())).join(', ')}.</div>` : ''}
          ${photoStrip(b.photos)}
        </div>`;
    }

    // Five-minute bird counts: birds per count each spring, native under introduced.
    // Only the current set of stations (2021 on) comes through from the export.
    function mbcCard(m) {
      const ys = m.years;
      const last = ys[ys.length - 1];
      const max = Math.max(...ys.map(y => y.native + y.introduced), 1);
      const cols = ys.map(y => `
        <div class="mbc-year"
             title="Spring ${y.year}: ${y.native} native + ${y.introduced} introduced birds per count · ${y.counts} counts at ${y.stations} stations">
          <span class="mbc-val">${y.native}</span>
          <span class="mbc-bar">
            <i class="x" style="height:${y.introduced / max * 100}%"></i>
            <i class="n" style="height:${y.native / max * 100}%"></i>
          </span>
          <span class="mbc-lbl">'${String(y.year).slice(2)}</span>
        </div>`).join('');

      const top = m.top || [];
      const tmax = Math.max(...top.map(t => t.perCount), 0.01);
      return `
        <div class="card grow">
          ${birdTabs(m)}
          <div class="card-head">
            <span class="badge">Five-minute bird counts &middot; Horizons</span>
            <span class="card-meta">Spring ${last.year}</span>
          </div>
          <div class="stats" style="grid-template-columns: 1fr 1fr auto">
            <div class="stat"><div class="stat-val">${last.native}</div><div class="stat-lbl">native birds per count</div></div>
            <div class="stat"><div class="stat-val">${last.nativeSpecies}</div><div class="stat-lbl">native species per count</div></div>
            <div class="stat"><div class="stat-val">${last.stations}</div><div class="stat-lbl">stations</div></div>
          </div>
          <div class="legend">
            <span class="sub-label" style="margin-right:auto">Birds per count, each spring</span>
            <span><i class="sw" style="background:var(--forest)"></i>native</span>
            <span><i class="sw" style="background:var(--intro)"></i>introduced</span>
          </div>
          <div class="mbc-chart">${cols}</div>
          <div class="sub-label">Most counted native birds, spring ${last.year} (per count)</div>
          <div class="top-list fill" data-trim>${top.map(t => `
            <div class="top"${t.watch ? ' data-keep' : ''} title="${esc(t.mi && t.mi !== t.name ? t.mi + ' · ' : '')}${esc(t.name)}: ${t.perCount} per count">
              <span class="top-name bird-name">${t.mi ? `<b>${esc(t.mi)}</b>` : `<b>${esc(t.name)}</b>`}${t.mi && t.mi !== t.name ? `<span class="en">${esc(t.name)}</span>` : ''}</span>
              <span class="bar"><i style="width:${t.perCount / tmax * 100}%"></i></span>
              <span class="num">${t.perCount.toFixed(1)}</span>
            </div>`).join('')}</div>
          <div class="note">Every bird seen or heard in five minutes at a fixed station,
            each spring since ${ys[0].year}.</div>
        </div>`;
    }

    // ── iNaturalist groups ────────────────────────────────────────────────────
    function photoStrip(photos) {
      if (!photos || !photos.length) return '';
      return `<div class="photos">${photos.map(p => `
        <a class="photo" href="${esc(p.obs)}" target="_blank" rel="noopener"
           title="${esc(p.name)}${p.sci && p.sci !== p.name ? ' (' + esc(p.sci) + ')' : ''} — © ${esc(p.credit)}, ${esc(p.licence)}, via iNaturalist">
          <img src="${esc(p.url)}" alt="${esc(p.name)}" loading="lazy" />
          <span>${esc(p.name)}<small>© ${esc(p.credit)}</small></span>
        </a>`).join('')}</div>`;
    }

    function topList(top) {
      if (!top || !top.length) return '';
      const max = Math.max(...top.map(t => t.count), 1);
      return `
        <div class="sub-label">Most recorded native species</div>
        <div class="top-list fill" data-trim>${top.map(t => `
          <div class="top" title="${esc(t.name)}${t.sci !== t.name ? ' (' + esc(t.sci) + ')' : ''}: ${t.count} sightings">
            <span class="top-name${t.name === t.sci ? ' sci' : ''}">${esc(t.name)}</span>
            <span class="bar"><i style="width:${t.count / max * 100}%"></i></span>
            <span class="num">${t.count}</span>
          </div>`).join('')}</div>`;
    }

    function groupCard(title, g, detailed) {
      // Names only, so all of them fit; the status is on hover
      const threat = detailed && g.threatened && g.threatened.length ? `
        <div class="sub-label">${g.threatened.length} threatened species recorded</div>
        <div class="threat-list">${g.threatened.map(t =>
          `<span class="threat" title="${esc(t.name)} (${esc(t.sci)}): ${esc(t.status)}"><em>!</em> ${esc(t.name)}</span>`).join('')}</div>` : '';
      const stats = detailed ? `
        <div class="stats">
          <div class="stat"><div class="stat-val">${fmt(g.species)}</div><div class="stat-lbl">species</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.native)}</div><div class="stat-lbl">native</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.endemic)}</div><div class="stat-lbl">endemic</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.introduced)}</div><div class="stat-lbl">introduced</div></div>
        </div>` : `
        <div class="stats three">
          <div class="stat"><div class="stat-val">${fmt(g.species)}</div><div class="stat-lbl">species</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.native)}</div><div class="stat-lbl">native</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.endemic)}</div><div class="stat-lbl">endemic</div></div>
        </div>`;
      return `
        <div class="card${detailed ? ' grow' : ''}">
          <div class="card-head">
            <span class="badge">${title} &middot; iNaturalist</span>
            <span class="card-meta">${fmt(g.obs)} sightings</span>
          </div>
          ${stats}
          ${detailed ? topList(g.top) : ''}
          ${threat}
          ${photoStrip(g.photos)}
        </div>`;
    }

    // ── Bats ──────────────────────────────────────────────────────────────────
    // A 24-hour clock with midnight at the top; one bar per hour, length by passes.
    function batClock(byHour) {
      const C = 59, R0 = 19, R1 = 46;
      const max = Math.max(...byHour, 1);
      const ang = h => (h / 24) * 2 * Math.PI - Math.PI / 2;   // 0h at top, 6am right, 6pm left
      const pt = (r, a) => [C + r * Math.cos(a), C + r * Math.sin(a)];
      // Night half (18:00 → 06:00) shaded, which with midnight at the top is the upper half
      const night = `<path d="M${C - R1 - 4},${C} A${R1 + 4},${R1 + 4} 0 0 1 ${C + R1 + 4},${C} Z"
                       fill="var(--forest-lt)"/>`;
      const bars = byHour.map((n, h) => {
        const a0 = ang(h) + 0.03, a1 = ang(h + 1) - 0.03;
        const r = R0 + (n / max) * (R1 - R0);
        if (!n) return '';
        const [x0, y0] = pt(R0, a0), [x1, y1] = pt(r, a0), [x2, y2] = pt(r, a1), [x3, y3] = pt(R0, a1);
        const hh = String(h).padStart(2, '0');
        return `<path d="M${x0},${y0} L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} L${x3},${y3} A${R0},${R0} 0 0 0 ${x0},${y0} Z"
                  fill="var(--forest)" opacity="0.85"><title>${hh}:00–${hh}:59 · ${n} passes</title></path>`;
      }).join('');
      const lbl = (txt, x, y, anchor) =>
        `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="8.5" fill="var(--caption)">${txt}</text>`;
      return `<svg viewBox="0 0 118 118" role="img" aria-label="Bat passes by hour of night">
        ${night}
        <circle cx="${C}" cy="${C}" r="${R0}" fill="var(--surface)" stroke="var(--border)"/>
        <circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="var(--border)" stroke-dasharray="2 2"/>
        ${bars}
        ${lbl('midnight', C, 8, 'middle')}
        ${lbl('6pm', 2, C + 12, 'start')}
        ${lbl('6am', 116, C + 12, 'end')}
        <text x="${C}" y="${C + 3}" text-anchor="middle" font-size="7.5" fill="var(--caption)">by hour</text>
      </svg>`;
    }

    function batCard(bats) {
      const s = bats && bats.surveys && bats.surveys[bats.surveys.length - 1];
      if (!s) return '';
      const from = day(s.from);
      const month = `${FULL_MONTHS[from.getMonth()]} ${from.getFullYear()}`;
      const max = Math.max(...s.byNight.passes, 1);
      const species = Object.keys(s.bySpecies);
      const lt = species.length === 1 && species[0] === 'Long-tailed';
      return `
        <div class="card">
          <div class="card-head">
            <span class="badge">Bats &middot; acoustic monitoring</span>
            <span class="card-meta">${month}</span>
          </div>
          <div class="bat-top">
            <div class="bat-clock">${batClock(s.byHour)}</div>
            <div>
              <div class="bat-big"><b>${fmt(s.passes)}</b><span>bat passes recorded</span></div>
              <div class="bat-sp">${lt ? 'Pekapeka-tou-roa <i>long-tailed bat</i>' : esc(species.join(', '))}</div>
              <div class="bat-facts">
                ${s.recorders.length} recorders &middot; bats on ${s.nightsWithBats} of ${s.nights} nights<br>
                <!-- Milestone from the Tōtara Reserve Annual Report 2025-26 (Bats / Pekapeka) -->
                First confirmed in the reserve in January 2026.
              </div>
            </div>
          </div>
          <div class="nights">
            <div class="night-bars">${s.byNight.passes.map((n, i) =>
              `<i class="${n ? '' : 'zero'}" style="height:${n ? Math.max(n / max * 100, 6) : 4}%"
                  title="Night of ${dayMon(s.byNight.dates[i])}: ${n} passes"></i>`).join('')}</div>
            <div class="night-axis"><span>${dayMon(s.from)}</span><span>passes per night</span><span>${dayMon(s.to)}</span></div>
          </div>
        </div>`;
    }

    // ── Page ──────────────────────────────────────────────────────────────────
    function render() {
      const root = document.getElementById('root');
      const d = BIO_DATA;
      if (!d) { root.innerHTML = '<p class="sub-label">No data yet — run the export script.</p>'; return; }

      const birds  = d.birds.species;
      const native = birds.filter(s => s.status !== 'introduced').length;
      const bat = d.bats && d.bats.surveys && d.bats.surveys[d.bats.surveys.length - 1];
      const gd = new Date(d.generated);
      const gen = `${gd.getDate()} ${MONTHS[gd.getMonth()]} ${gd.getFullYear()}`;
      const tile = (label, val, sub) => `
        <div class="tile">
          <div class="tile-label">${label}</div>
          <div class="tile-val">${val}</div>
          <div class="tile-sub">${sub}</div>
        </div>`;

      root.innerHTML = `
        <div class="head">
          <div class="title-block">
            <a class="eyebrow" href="https://experience.arcgis.com/experience/0b02dc0ca9c545f7bf31fe3ea20ace1a?draft=true" target="_blank" rel="noopener">← Tōtara Reserve</a>
            <h1>Biodiversity</h1>
            <div class="period">Species recorded on eBird and iNaturalist</div>
          </div>
          <div class="tiles">
            ${tile('Bird species', birds.length, `${native} native`)}
            ${tile('Plant species', fmt(d.plants.species), `${fmt(d.plants.native)} native`)}
            ${tile('Insect species', fmt(d.insects.species), `${fmt(d.insects.native)} native`)}
            ${tile('Fungi species', fmt(d.fungi.species), `${fmt(d.fungi.native)} native`)}
            ${bat ? tile('Bat passes', fmt(bat.passes),
                `Long-tailed bat &middot; ${MONTHS[day(bat.from).getMonth()]} ${day(bat.from).getFullYear()}`) : ''}
          </div>
        </div>

        <div class="cols">
          <div class="col">${birdCard(d.birds, d.fiveMbc)}</div>
          <div class="col">
            ${groupCard('Plants', d.plants, true)}
            ${groupCard('Fungi', d.fungi, false)}
          </div>
          <div class="col">
            ${groupCard('Insects', d.insects, true)}
            ${batCard(d.bats)}
          </div>
        </div>

        <div class="dash-footer">
          <span>Data: eBird &middot; iNaturalist (research grade) &middot; Horizons Regional Council bird counts and bat monitoring</span>
          <span>Updated ${gen}</span>
        </div>`;
      trimToFit();
    }

    // Drop whole rows from the end of each fill list until it fits its box.
    // Skipped while the frame has no size yet (ExB can mount embeds hidden);
    // the ResizeObserver renders again once it has one.
    // With data-more, a closing "+ N more" line names the dropped rows on hover.
    // Rows marked data-keep are skipped, so the row above them goes instead.
    function trimToFit() {
      document.querySelectorAll('[data-trim]').forEach(list => {
        if (!list.clientHeight) return;
        const over = () => list.scrollHeight > list.clientHeight + 1;
        const dropped = [];
        let more = null;
        while (over() && list.children.length > (more ? 2 : 1)) {
          const row = [...list.children].reverse().find(r => r !== more && !r.hasAttribute('data-keep'));
          if (!row) break;
          dropped.unshift(row.getAttribute('title') || '');
          row.remove();
          if (list.dataset.more && !more) {
            more = document.createElement('div');
            more.className = 'more';
            list.appendChild(more);
          }
          if (more) {
            more.textContent = `+ ${dropped.length} more ${list.dataset.more}`;
            more.title = dropped.map(t => t.split(':')[0]).join('\n');
          }
        }
      });
    }

    document.addEventListener('click', e => {
      const tab = e.target.closest('[data-bird-tab]');
      if (tab && tab.dataset.birdTab !== birdTab) { birdTab = tab.dataset.birdTab; render(); }
    });

    document.addEventListener('DOMContentLoaded', () => {
      render();
      new ResizeObserver(render).observe(document.getElementById('root'));
      // The web font makes rows a little taller than the fallback font, so lists
      // trimmed before it arrived can overflow — fit them again once it has.
      // fonts.ready alone can resolve before the font has even been requested.
      document.fonts.ready.then(render);
      document.fonts.addEventListener('loadingdone', render);
    });
    window.addEventListener('load', render);
  </script>
</head>
<body data-base-w="1111" data-base-h="687">
  <script src="fit.js?v=1"></script>
  <div id="root"></div>
</body>
</html>
