<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biodiversity · Tōtara Reserve</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens as predator-control.html */
    :root {
      --navy:       #222222;
      --bg:         #f0f0f0;
      --surface:    #ffffff;
      --border:     #dcdcdc;
      --muted:      #515151;
      --caption:    #8a8a8a;
      --forest:     #047f67;
      --forest-lt:  #e2f1ed;
      --lime:       #86be3d;   /* the website's "Book online" green */
      --unsafe:     #9b2226;

      --inat:       var(--forest);
      --ebird:      var(--lime);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      padding: 12px 16px 8px;
    }

    /* ── LAYOUT: one embed filling the whole ExB page, 1111 × 687 ── */
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .head {
      display: flex;
      gap: 12px;
      flex: 0 0 92px;
    }

    .title-block {
      flex: 0 0 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--forest);
    }

    /* Back link to the app's Main Page */
    a.eyebrow { text-decoration: none; align-self: flex-start; }
    a.eyebrow:hover { text-decoration: underline; }

    h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .period { font-size: 0.78rem; color: var(--muted); }

    .tiles {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .tile, .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      min-width: 0;
    }

    .tile {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .tile-label, .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tile-label { color: var(--caption); }

    .tile-val {
      font-size: 1.75rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .tile-sub { font-size: 0.72rem; color: var(--caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .cols {
      flex: 1;
      display: grid;
      grid-template-columns: 1.12fr 1fr 1fr;
      gap: 10px;
      min-height: 0;
    }
    /* A single species' trend chart takes the plants and fungi column as well.
       No transition: the chart redraws on every resize step, so sliding the
       columns would redraw it dozens of times on the way. */
    .cols.bird-wide { grid-template-columns: 2.12fr 1fr; }

    .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

    .card {
      padding: 11px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .card.grow { flex: 1; }

    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .badge { color: var(--forest); }
    .card-meta { font-size: 0.72rem; color: var(--caption); white-space: nowrap; }

    .sub-label { font-size: 0.76rem; color: var(--caption); }

    .note {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
      padding-top: 7px;
      border-top: 1px solid var(--border);
    }

    /* Lists that fill the space they are given. trimToFit() drops whole rows
       from the end rather than letting the card cut one in half. */
    .fill { flex: 1; min-height: 0; overflow: hidden; }

    /* ── BIRDS ── */
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.74rem; color: var(--muted); }
    /* Direct children only — the E / ! marks inside are spans too */
    .legend > span { display: inline-flex; align-items: center; gap: 5px; }
    .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .bird-list { display: flex; flex-direction: column; justify-content: space-between; }

    .bird {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px 24px;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      line-height: 1.2;
      min-height: 14px;
    }

    .more { font-size: 0.72rem; color: var(--caption); font-style: italic; }

    .bird-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bird-name b { font-weight: 600; }
    .bird-name .en { color: var(--caption); margin-left: 4px; }

    .mark {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      line-height: 13px;
      width: 13px;
      text-align: center;
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: 1px;
    }
    .mark.e { color: var(--forest); border: 1px solid var(--forest); }
    .mark.t { color: #fff; background: var(--unsafe); }

    .stack { display: flex; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .stack i { display: block; height: 100%; }
    .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    .intro-line {
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .intro-line.one { -webkit-line-clamp: 1; }
    .intro-line b { color: var(--navy); font-weight: 600; }

    .info {
      margin-left: auto;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid var(--caption);
      color: var(--caption);
      font-size: 9px;
      font-weight: 700;
      font-style: italic;
      font-family: Georgia, serif;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      cursor: help;
    }

    /* Bird card tabs: species recorded / five-minute bird counts */
    .tabs { display: flex; gap: 4px; flex-shrink: 0; }
    .tab {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 10px;
      cursor: pointer;
    }
    .tab:hover { border-color: var(--forest); }
    .tab.on { color: #fff; background: var(--forest); border-color: var(--forest); }

    /* ── FIVE-MINUTE BIRD COUNTS ── */
    :root { --intro: #b9b9b9; }

    .mbc-chart { display: flex; align-items: stretch; gap: 4px; height: 112px; flex-shrink: 0; }
    .mbc-year { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .mbc-val { font-size: 0.68rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mbc-bar { flex: 1; width: 70%; display: flex; flex-direction: column; justify-content: flex-end; }
    .mbc-bar i { display: block; width: 100%; }
    .mbc-bar i.n { background: var(--forest); opacity: 0.85; border-radius: 0 0 2px 2px; }
    .mbc-bar i.x { background: var(--intro); border-radius: 2px 2px 0 0; }
    .mbc-lbl { font-size: 0.68rem; color: var(--caption); }

    /* ── SPECIES TRENDS ── */
    .tr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; flex: 1; min-height: 0; }
    .tr-cell { border: 1px solid var(--border); border-radius: 5px; padding: 4px 5px 2px;
      display: flex; flex-direction: column; background: var(--surface); cursor: pointer;
      font: inherit; text-align: left; min-height: 0; }
    .tr-cell:hover { border-color: var(--forest); background: var(--forest-lt); }
    .tr-cell .nm { font-size: 0.7rem; font-weight: 600; line-height: 1.1; }
    .tr-cell .en { font-size: 0.58rem; color: var(--caption); line-height: 1.1; }
    .tr-cell svg { flex: 1; min-height: 0; width: 100%; display: block; }
    .tr-cell .vl { font-size: 0.68rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tr-back { font-size: 0.68rem; color: var(--forest); cursor: pointer; background: none;
      border: 0; padding: 0; font-family: inherit; }
    .tr-actions { display: flex; gap: 9px; align-items: center; }
    .export-btn { display: inline-flex; align-items: center; gap: 3px; font: inherit;
      font-size: 0.64rem; color: var(--muted); background: var(--bg); cursor: pointer;
      border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; }
    .export-btn:hover { border-color: var(--forest); color: var(--forest); }
    .legend .sw.dash { width: 13px; height: 0; border: 0; border-top: 2px dashed var(--caption);
      border-radius: 0; align-self: center; }
    .legend .sw.tick { width: 0; height: 10px; border: 0; border-left: 2px solid currentColor;
      border-radius: 0; align-self: center; }
    .tr-host { flex: 1; min-height: 90px; position: relative; }
    .tr-host > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    #tip { position: fixed; display: none; z-index: 40; background: var(--surface);
      border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,.13); font-size: 0.7rem; pointer-events: none; }
    #tip .th { font-weight: 700; margin-bottom: 2px; }
    #tip .tr { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
    #tip .tr i { font-style: normal; margin-left: auto; padding-left: 10px; color: var(--caption); }

    /* ── iNATURALIST GROUP CARDS ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stats.three { grid-template-columns: repeat(3, 1fr); }
    .stat { background: var(--bg); border-radius: 5px; padding: 3px 8px 4px; min-width: 0; }
    .stat-val { font-size: 1.05rem; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 0.66rem; color: var(--muted); white-space: nowrap; }

    .top-list { display: flex; flex-direction: column; gap: 3px; }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px 22px;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
    }
    .top-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    .top-name.sci { font-style: italic; }
    .bar { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--forest); opacity: 0.75; border-radius: 4px; }

    /* Small enough that six pills usually sit on one row */
    .threat-list { display: flex; flex-wrap: wrap; gap: 3px; flex-shrink: 0; }
    .threat {
      font-size: 0.62rem;
      line-height: 1.3;
      border: 1px solid #e3c4c5;
      background: #fbf3f3;
      color: var(--navy);
      border-radius: 9px;
      padding: 0 5px;
      white-space: nowrap;
    }
    .threat em { font-style: normal; color: var(--unsafe); }

    .photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }
    /* Fixed height, not an aspect ratio: on a wide screen the columns widen, and
       photos that grew with them took the room the "Most recorded" lists need. */
    .photo {
      position: relative;
      display: block;
      height: 66px;
      border-radius: 5px;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      text-decoration: none;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo span {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 10px 5px 3px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
      font-size: 9.5px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .photo span small { display: block; font-size: 8px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; }

    /* ── BATS ── */
    .bat-top { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; align-items: center; }
    .bat-clock svg { width: 118px; height: 118px; display: block; }
    .bat-big { display: flex; align-items: baseline; gap: 6px; }
    .bat-big b { font-size: 1.9rem; font-weight: 300; line-height: 1; }
    .bat-big span { font-size: 0.78rem; color: var(--muted); }
    .bat-sp { font-size: 0.86rem; font-weight: 600; margin-top: 3px; }
    .bat-sp i { font-weight: 400; color: var(--caption); font-style: normal; }
    .bat-facts { font-size: 0.74rem; color: var(--muted); line-height: 1.5; margin-top: 4px; }

    .nights { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .night-bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; }
    .night-bars i { flex: 1; background: var(--forest); opacity: 0.75; border-radius: 2px 2px 0 0; min-height: 1px; }
    .night-bars i.zero { background: var(--border); opacity: 1; }
    .night-axis { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--caption); }

    /* ── FOOTER ── */
    .dash-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--caption);
      gap: 4px;
      flex: 0 0 auto;
    }
  </style>

    /* BIO_DATA_END */

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const FULL_MONTHS = ['January','February','March','April','May','June','July',
                         'August','September','October','November','December'];
    const fmt = n => Number(n).toLocaleString('en-NZ');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // 'YYYY-MM-DD' read as a local date, not UTC midnight
    const day = iso => new Date(iso + 'T00:00:00');
    const dayMon = iso => { const d = day(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

    // ── Birds ─────────────────────────────────────────────────────────────────
    function birdRow(s, max) {
      const total = s.inat + s.ebird;
      const name = s.mi
        ? `<b>${esc(s.mi)}</b><span class="en">${esc(s.name)}</span>`
        : `<b>${esc(s.name)}</b>`;
      const marks = (s.status === 'endemic' ? '<span class="mark e" title="Endemic — found only in New Zealand">E</span>' : '')
        + (s.threat ? `<span class="mark t" title="${esc(s.threat)}">!</span>` : '');
      const tip = `${s.mi ? s.mi + ' · ' : ''}${s.name} (${s.sci}): ${s.inat} iNaturalist, ${s.ebird} eBird`
        + (s.threat ? ` · ${s.threat}` : '');
      return `
        <div class="bird" title="${esc(tip)}">
          <span class="bird-name">${name}${marks}</span>
          <span class="stack">
            <i style="width:${s.inat / max * 100}%;background:var(--inat)"></i>
            <i style="width:${s.ebird / max * 100}%;background:var(--ebird)"></i>
          </span>
          <span class="num">${total}</span>
        </div>`;
    }

    // Which tab the bird card shows. Kept outside render(), which rebuilds the
    // page on every resize. #counts in the URL opens the bird counts tab.
    let birdTab = location.hash === '#counts' ? 'counts'
                : location.hash === '#trend'  ? 'trend' : 'species';

    // Per-species trends. Absent from older data, in which case the tab is not
    // offered and the card behaves as it did before.
    const TREND = (BIO_DATA.fiveMbc && BIO_DATA.fiveMbc.trend) || null;

    function birdTabs(mbc) {
      if (!mbc) return '';
      const tabs = [['species', 'Species recorded'], ['counts', 'Bird counts']];
      if (TREND) tabs.push(['trend', 'Species trend']);
      return `<div class="tabs">${tabs.map(([k, label]) =>
        `<button class="tab${birdTab === k ? ' on' : ''}" data-bird-tab="${k}">${label}</button>`).join('')}</div>`;
    }

    function birdCard(b, mbc) {
      if (mbc && birdTab === 'counts') return mbcCard(mbc);
      if (TREND && birdTab === 'trend') return trendCard(mbc);
      const native = b.species.filter(s => s.status !== 'introduced');
      const intro  = b.species.filter(s => s.status === 'introduced');
      const max = Math.max(...native.map(s => s.inat + s.ebird), 1);
      const threatened = native.filter(s => s.threat);
      const hotspots = (b.hotspots || []).join(' and ');
      return `
        <div class="card grow">
          ${birdTabs(mbc)}
          <div class="card-head">
            <span class="badge">Native birds &middot; eBird + iNaturalist</span>
            <span class="card-meta">${native.length} species</span>
          </div>
          <div class="legend">
            <span><i class="sw" style="background:var(--inat)"></i>iNaturalist</span>
            <span><i class="sw" style="background:var(--ebird)"></i>eBird</span>
            <span><span class="mark e" style="margin:0">E</span>endemic</span>
            ${threatened.length ? '<span><span class="mark t" style="margin:0">!</span>threatened</span>' : ''}
            <span class="info" title="How birds are counted: sightings, not birds. Each iNaturalist observation and each eBird checklist naming the species counts once.${hotspots ? '&#10;eBird hotspots: ' + esc(hotspots) + '.' : ''}">i</span>
          </div>
          <div class="bird-list fill" data-trim data-more="native species">${native.map(s => birdRow(s, max)).join('')}</div>
          ${threatened.length ? `<div class="intro-line one">${threatened.map(s =>
            `<b>${esc(s.mi || s.name)}</b> ${s.mi ? '(' + esc(s.name.toLowerCase()) + ') ' : ''}is ${esc(s.threat)}.`).join(' ')}</div>` : ''}
          ${intro.length ? `<div class="intro-line one" title="${esc(intro.map(s => s.name).join(', '))}"><b>Also ${intro.length} introduced species:</b>
            ${intro.map(s => esc(s.name.toLowerCase())).join(', ')}.</div>` : ''}
          ${photoStrip(b.photos)}
        </div>`;
    }

    // Five-minute bird counts: birds per count each spring, native under introduced.
    // Only the current set of stations (2021 on) comes through from the export.
    function mbcCard(m) {
      const ys = m.years;
      const last = ys[ys.length - 1];
      const max = Math.max(...ys.map(y => y.native + y.introduced), 1);
      const cols = ys.map(y => `
        <div class="mbc-year"
             title="Spring ${y.year}: ${y.native} native + ${y.introduced} introduced birds per count · ${y.counts} counts at ${y.stations} stations">
          <span class="mbc-val">${y.native}</span>
          <span class="mbc-bar">
            <i class="x" style="height:${y.introduced / max * 100}%"></i>
            <i class="n" style="height:${y.native / max * 100}%"></i>
          </span>
          <span class="mbc-lbl">'${String(y.year).slice(2)}</span>
        </div>`).join('');

      const top = m.top || [];
      const tmax = Math.max(...top.map(t => t.perCount), 0.01);
      return `
        <div class="card grow">
          ${birdTabs(m)}
          <div class="card-head">
            <span class="badge">Five-minute bird counts &middot; Horizons</span>
            <span class="card-meta">Spring ${last.year}</span>
          </div>
          <div class="stats" style="grid-template-columns: 1fr 1fr auto">
            <div class="stat"><div class="stat-val">${last.native}</div><div class="stat-lbl">native birds per count</div></div>
            <div class="stat"><div class="stat-val">${last.nativeSpecies}</div><div class="stat-lbl">native species per count</div></div>
            <div class="stat"><div class="stat-val">${last.stations}</div><div class="stat-lbl">stations</div></div>
          </div>
          <div class="legend">
            <span class="sub-label" style="margin-right:auto">Birds per count, each spring</span>
            <span><i class="sw" style="background:var(--forest)"></i>native</span>
            <span><i class="sw" style="background:var(--intro)"></i>introduced</span>
          </div>
          <div class="mbc-chart">${cols}</div>
          <div class="sub-label">Most counted native birds, spring ${last.year} (per count)</div>
          <div class="top-list fill" data-trim>${top.map(t => `
            <div class="top"${t.watch ? ' data-keep' : ''} title="${esc(t.mi && t.mi !== t.name ? t.mi + ' · ' : '')}${esc(t.name)}: ${t.perCount} per count">
              <span class="top-name bird-name">${t.mi ? `<b>${esc(t.mi)}</b>` : `<b>${esc(t.name)}</b>`}${t.mi && t.mi !== t.name ? `<span class="en">${esc(t.name)}</span>` : ''}</span>
              <span class="bar"><i style="width:${t.perCount / tmax * 100}%"></i></span>
              <span class="num">${t.perCount.toFixed(1)}</span>
            </div>`).join('')}</div>
          <div class="note">Every bird seen or heard in five minutes at a fixed station,
            each spring since ${ys[0].year}.</div>
        </div>`;
    }

    // ── Species trends ────────────────────────────────────────────────────────
    // Drawn to match the Biodiversity team's existing analysis: one point per
    // transect per year, their standard errors, a fitted line with its 95% band,
    // and the rat tracking tunnel index against the right-hand axis. The figures
    // are theirs unchanged — see extract_5mbc_data() in the export script.
    const TR_COLOURS = ['var(--forest)', '#b3581f', '#6a4c93'];
    const TR_STATUS  = { Native: 'var(--forest)', Introduced: '#b3581f' };
    const TR_TOP = 6;                       // fixed axis: 0-6 birds against 0-100%
    const TR_OPERATION = '#4f7f22';         // toxin operations; events are grey
    let trendSel = null;                    // null shows the grid of all species

    const trFind = k => TREND.species.concat(TREND.groups).find(s => s.key === k);
    const trYearFrac = iso => {
      const d = new Date(iso + 'T00:00:00'), y = d.getFullYear();
      return y + (d - new Date(y, 0, 1)) / (new Date(y + 1, 0, 1) - new Date(y, 0, 1));
    };
    const monthLabel = iso => {
      const d = new Date(iso + 'T00:00:00');
      return `${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
    };

    function trSpark(series, w, h) {
      const max = Math.max(...series.flatMap(s => s.ys.filter(v => v !== null)), 0.3);
      const x = i => 1.5 + i * (w - 3) / (TREND.years.length - 1);
      const y = v => h - 2.5 - (v / max) * (h - 5);
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${series.map(s => {
        const pts = s.ys.map((v, i) => [x(i), v]).filter(p => p[1] !== null);
        if (!pts.length) return '';
        const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
        return `<path d="${d}" fill="none" stroke="${s.colour}" stroke-width="1.6"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${y(pts[pts.length - 1][1]).toFixed(1)}"
            r="2.2" fill="${s.colour}"/>`;
      }).join('')}</svg>`;
    }

    function trendCard(mbc) {
      return `
        <div class="card grow">
          ${birdTabs(mbc)}
          ${trendSel ? trendDetail() : trendGrid()}
        </div>`;
    }

    function trendGrid() {
      const cell = (key, name, en, series, value) => `
        <button class="tr-cell" data-trend-sp="${key}" title="${esc(name)}${en ? ' / ' + esc(en) : ''}">
          <span class="nm">${esc(name)}</span>
          <span class="en">${en ? esc(en) : '&nbsp;'}</span>
          ${trSpark(series, 100, 30)}
          <span class="vl">${value === null ? '&ndash;' : value.toFixed(2)}</span>
        </button>`;
      const last = a => a[a.length - 1];
      const cells = TREND.species.map(sp =>
        cell(sp.key, sp.mi, sp.name, [{ ys: sp.mean, colour: 'var(--forest)' }], last(sp.mean)))
        .join('') + cell('STATUS', 'Native & introduced', 'all birds',
          [{ ys: TREND.groups[0].mean, colour: TR_STATUS.Native },
           { ys: TREND.groups[1].mean, colour: TR_STATUS.Introduced }],
          last(TREND.groups[0].mean));
      return `
        <div class="card-head">
          <span class="badge">Species trends &middot; Horizons bird counts</span>
          <span class="card-meta">${TREND.years[0]}&ndash;${TREND.years[TREND.years.length - 1]}</span>
        </div>
        <div class="sub-label">Mean birds per count &middot; choose a species</div>
        <div class="tr-grid">${cells}</div>
        <div class="note">Counts at the same stations each spring since ${TREND.years[0]}.</div>`;
    }

    function trendDetail() {
      const isStatus = trendSel === 'STATUS';
      const sp = isStatus ? TREND.groups[0] : trFind(trendSel);
      const name = isStatus ? 'Native &amp; introduced'
        : esc(sp.mi) + (sp.name ? ' &middot; ' + esc(sp.name) : '');
      const legend = isStatus
        ? TREND.groups.map(g => [g.mi, TR_STATUS[g.mi]])
        : TREND.transects.map((t, i) => [t, TR_COLOURS[i]]);
      const empty = !isStatus && !sp.total;
      return `
        <div class="card-head">
          <span class="badge">${name}</span>
          <span class="tr-actions">
            ${empty ? '' : `<button class="export-btn" data-export="1" title="Download this chart as a PNG">${EXPORT_ICON}PNG</button>`}
            <button class="tr-back" data-trend-sp="">&larr; all species</button>
          </span>
        </div>
        <div class="legend">
          ${legend.map(([t, c]) => `<span><i class="sw" style="background:${c}"></i>${esc(t)}</span>`).join('')}
          <span><i class="sw dash"></i>rat index</span>
          ${(TREND.events || []).some(e => e.kind !== 'event')
            ? `<span><i class="sw tick" style="border-color:${TR_OPERATION}"></i>baiting</span>` : ''}
          ${(TREND.events || []).some(e => e.kind === 'event')
            ? '<span><i class="sw tick" style="border-color:var(--caption)"></i>cyclone or flood</span>' : ''}
        </div>
        <div class="tr-host" id="tr-host"></div>
        <div class="note">${empty
          ? 'Not recorded at any station since ' + TREND.years[0] + '.'
          : (isStatus
            ? 'Average count per species at each transect, native and introduced, with standard errors.'
            : 'Mean birds per five-minute count at each transect, with standard errors and a fitted trend since ' + TREND.years[0] + '.')}
          Dashed line is the rat tracking tunnel index against the right-hand axis;
          dotted line marks 20%.</div>`;
    }

    // Drawn at the host's own pixel size and redrawn by render(); a host with no
    // size yet is skipped, the same guard the other pages use for hidden embeds.
    // The chart markup at a given size. `big` is the export layout: a framed plot
    // with both axes named and full years, which the dashboard card has no room
    // for. Everything else is identical, so the two cannot drift apart.
    function trendChartMarkup(W, H, big) {
      const isStatus = trendSel === 'STATUS';
      const SER = isStatus
        ? TREND.groups.map(g => ({ sp: g, label: g.mi, col: TR_STATUS[g.mi] }))
        : [{ sp: trFind(trendSel), label: null, col: null }];

      const ml = big ? 58 : 24, mr = big ? 64 : 26;
      // the foot carries the year labels and, below them, a lane of baiting markers
      const mt = big ? 12 : 8, mb = big ? 42 : 26;
      const fs = big ? 11 : 8.5;
      const cw = W - ml - mr, ch = H - mt - mb;
      const yrs = TREND.years, lastYear = yrs[yrs.length - 1];
      const x0 = yrs[0] - 0.45;
      // Counts sit on their year, but rat surveys and baiting operations sit on
      // their actual date, so the newest of those can fall beyond the last count.
      // The axis stretches to take them in, up to a year past the last count.
      const x1 = Math.min(lastYear + 1.1, Math.max(lastYear + 0.45, 0.08 + Math.max(
        lastYear,
        ...(TREND.tti.dates || []).map(trYearFrac),
        ...(TREND.events || []).map(e => trYearFrac(e.date)))));
      const xOf = y => ml + (y - x0) / (x1 - x0) * cw;
      const yOf = v => mt + ch - (Math.min(v, TR_TOP) / TR_TOP) * ch;
      const tOf = v => mt + ch - (v / 100) * ch;
      let s = '';

      for (let v = 0; v <= TR_TOP; v++) {
        s += `<line x1="${ml}" y1="${yOf(v).toFixed(1)}" x2="${ml + cw}" y2="${yOf(v).toFixed(1)}"
                stroke="var(--border)" stroke-width="1" opacity=".55"/>
              <text x="${ml - (big ? 8 : 4)}" y="${(yOf(v) + 3).toFixed(1)}" text-anchor="end"
                font-size="${fs}" fill="var(--caption)">${v}</text>`;
      }
      for (let v = 0; v <= 100; v += (big ? 20 : 25)) {
        s += `<text x="${ml + cw + (big ? 8 : 4)}" y="${(tOf(v) + 3).toFixed(1)}"
                font-size="${fs}" fill="var(--caption)">${v}</text>`;
      }
      s += `<line x1="${ml}" y1="${tOf(20).toFixed(1)}" x2="${ml + cw}" y2="${tOf(20).toFixed(1)}"
              stroke="var(--caption)" stroke-width="1" stroke-dasharray="1 3"/>`;
      yrs.forEach(y => { s += `<text x="${xOf(y).toFixed(1)}" y="${(mt + ch + (big ? 20 : 12)).toFixed(1)}"
              text-anchor="middle" font-size="${fs}" fill="var(--caption)">${
              big ? y : "'" + String(y).slice(2)}</text>`; });

      // Baiting operations and notable events, in a lane below the year labels.
      // No text against each one: fourteen markers share only five toxin names, so
      // labelling every occurrence just stacks the same words on top of each other.
      // The toxin is in the legend, on hover, and in the key under the PNG export.
      const laneTop = mt + ch + (big ? 26 : 16);
      const laneH = big ? 10 : 7;
      (TREND.events || []).forEach(ev => {
        const xf = trYearFrac(ev.date);
        if (xf < x0 || xf > x1) return;
        const X = xOf(xf);
        const col = ev.kind === 'event' ? 'var(--caption)' : TR_OPERATION;
        s += `<line x1="${X.toFixed(1)}" y1="${laneTop.toFixed(1)}" x2="${X.toFixed(1)}"
                y2="${(laneTop + laneH).toFixed(1)}" stroke="${col}"
                stroke-width="${big ? 2 : 1.6}"/>`;
        // a wider invisible target, or a 2px rule is near impossible to hover
        s += `<rect class="tr-ev" x="${(X - 4.5).toFixed(1)}" y="${(laneTop - 2).toFixed(1)}"
                width="9" height="${laneH + 4}" fill="transparent"
                data-label="${esc(ev.label)}" data-when="${esc(monthLabel(ev.date))}"
                data-kind="${ev.kind}"/>`;
      });

      if (big) {
        s += `<rect x="${ml}" y="${mt}" width="${cw}" height="${ch}" fill="none"
                stroke="var(--caption)" stroke-width="1"/>
              <text transform="translate(${ml - 40},${mt + ch / 2}) rotate(-90)"
                text-anchor="middle" font-size="12" fill="var(--muted)">Mean bird count</text>
              <text transform="translate(${ml + cw + 48},${mt + ch / 2}) rotate(90)"
                text-anchor="middle" font-size="12" fill="var(--muted)">Rat tracking tunnel index (%)</text>`;
      }

      const pts = (TREND.tti.dates || []).map((d, i) => [trYearFrac(d), TREND.tti.rat[i]])
                                         .filter(p => p[0] >= x0 && p[0] <= x1);
      if (pts.length) {
        s += `<path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${xOf(p[0]).toFixed(1)},${tOf(p[1]).toFixed(1)}`).join('')}"
                fill="none" stroke="var(--caption)" stroke-width="1.3" stroke-dasharray="4 3"/>`;
        pts.forEach(p => { s += `<circle cx="${xOf(p[0]).toFixed(1)}" cy="${tOf(p[1]).toFixed(1)}"
                r="1.7" fill="var(--caption)"/>`; });
      }

      const f = isStatus ? null : SER[0].sp.fit;
      if (f) {
        const up = f.band.map((b, i) => `${i ? 'L' : 'M'}${xOf(b[0]).toFixed(1)},${yOf(Math.max(b[2], 0)).toFixed(1)}`).join('');
        const dn = f.band.slice().reverse().map(b => `L${xOf(b[0]).toFixed(1)},${yOf(Math.max(b[1], 0)).toFixed(1)}`).join('');
        s += `<path d="${up}${dn}Z" fill="var(--navy)" opacity=".08"/>
              <line x1="${xOf(yrs[0])}" y1="${yOf(f.y0).toFixed(1)}"
                x2="${xOf(yrs[yrs.length - 1])}" y2="${yOf(f.y1).toFixed(1)}"
                stroke="var(--navy)" stroke-width="1.8" opacity=".75"/>`;
      }

      // the two statuses sit either side of the year so their points do not overlap
      const off = isStatus ? [[-.19, -.13, -.07], [.07, .13, .19]] : [[-.13, 0, .13]];
      SER.forEach((ser, si) => ser.sp.byTransect.forEach((row, i) => row.forEach((v, j) => {
        if (v === null) return;
        const X = xOf(yrs[j] + off[si][i]), col = isStatus ? ser.col : TR_COLOURS[i];
        const se = ser.sp.se[i][j] || 0;
        if (se) s += `<line x1="${X.toFixed(1)}" y1="${yOf(Math.max(v - se, 0)).toFixed(1)}"
            x2="${X.toFixed(1)}" y2="${yOf(v + se).toFixed(1)}" stroke="${col}"
            stroke-width="${big ? 1.4 : 1.1}"/>`;
        s += `<circle cx="${X.toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${big ? 4.6 : 3.4}"
            fill="${col}" stroke="var(--surface)" stroke-width="1.4"/>`;
      })));

      return { s, geom: { ml, mt, cw, ch, x0, x1, isStatus, SER } };
    }

    function drawTrendChart() {
      const host = document.getElementById('tr-host');
      if (!host || !trendSel) return;
      const W = host.clientWidth, H = host.clientHeight;
      if (!W || !H) return;
      const { s, geom } = trendChartMarkup(W, H, false);
      const { ml, mt, cw, ch, x0, x1, isStatus, SER } = geom;
      const yrs = TREND.years;
      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}
        <rect class="tr-hit" x="${ml}" y="${mt}" width="${cw}" height="${ch}" fill="transparent"/></svg>`;

      // the marker lane sits outside .tr-hit, so each marker can take the pointer
      host.querySelectorAll('.tr-ev').forEach(node => {
        node.addEventListener('mousemove', e => {
          const kind = node.dataset.kind === 'event' ? 'var(--caption)' : TR_OPERATION;
          trShowTip(e, `<div class="th">${esc(node.dataset.label)}</div>
            <div class="tr"><i class="sw" style="background:${kind}"></i>${
            node.dataset.kind === 'event' ? 'Recorded' : 'Baiting'}<i>${esc(node.dataset.when)}</i></div>`);
        });
        node.addEventListener('mouseleave', trHideTip);
      });

      const hit = host.querySelector('.tr-hit');
      hit.addEventListener('mousemove', e => {
        const r = host.getBoundingClientRect(), sc = window.fitScale ? window.fitScale() : 1;
        const yr = x0 + ((e.clientX - r.left) / sc - ml) / cw * (x1 - x0);
        const j = yrs.reduce((b, y, i) => Math.abs(y - yr) < Math.abs(yrs[b] - yr) ? i : b, 0);
        const rows = SER.map(ser => TREND.transects.map((t, i) =>
          ser.sp.byTransect[i][j] === null ? '' :
          `<div class="tr"><i class="sw" style="background:${isStatus ? ser.col : TR_COLOURS[i]}"></i>
            ${isStatus ? esc(ser.label) + ' &middot; ' : ''}${esc(t)}
            <i>${ser.sp.byTransect[i][j].toFixed(2)}</i></div>`).join('')).join('');
        trShowTip(e, `<div class="th">${isStatus ? 'All birds' : esc(SER[0].sp.mi)} &middot; ${yrs[j]}</div>${rows}`);
      });
      hit.addEventListener('mouseleave', trHideTip);
    }

    function trShowTip(e, html) {
      let t = document.getElementById('tip');
      if (!t) { t = document.createElement('div'); t.id = 'tip'; document.body.appendChild(t); }
      t.innerHTML = html; t.style.display = 'block';
      const s = window.fitScale ? window.fitScale() : 1;
      let x = e.clientX / s + 12, y = e.clientY / s + 10;
      if (x + t.offsetWidth > document.body.clientWidth - 4) x = e.clientX / s - t.offsetWidth - 12;
      if (y + t.offsetHeight > document.body.clientHeight - 4) y = e.clientY / s - t.offsetHeight - 10;
      t.style.left = x + 'px'; t.style.top = y + 'px';
    }
    const trHideTip = () => { const t = document.getElementById('tip'); if (t) t.style.display = 'none'; };

    // ── Chart as a PNG ────────────────────────────────────────────────────────
    // The chart's SVG is copied with its colour variables filled in — a stand-alone
    // image cannot see the page's CSS — then drawn on a canvas under a title and
    // legend and opened in a new tab with a download link, because Experience
    // Builder blocks downloads straight from an embed.
    const EXPORT_ICON = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/></svg>`;
    const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const resolveVars = s => s.replace(/var\((--[\w-]+)\)/g, (_, n) => cssVar(n) || '#000');

    async function exportTrendChart() {
      const host = document.getElementById('tr-host');
      const svg = host && host.querySelector('svg');
      if (!svg) return;
      trHideTip();
      const win = window.open('', '_blank');     // opened on the click itself, or
      if (!win) {                                // the pop-up blocker stops it
        alert('Allow pop-ups for this site to download the chart.');
        return;
      }
      const isStatus = trendSel === 'STATUS';
      const sp = isStatus ? null : trFind(trendSel);
      const title = isStatus ? 'Native and introduced birds'
        : sp.mi + (sp.name ? ' · ' + sp.name : '');
      // colours have to be resolved here too: a canvas cannot read var(--forest)
      const legend = (isStatus
        ? TREND.groups.map(g => [g.mi, resolveVars(TR_STATUS[g.mi])])
        : TREND.transects.map((t, i) => [t, resolveVars(TR_COLOURS[i])]))
        .concat([['Rat tracking tunnel index', cssVar('--caption'), 'dash']]);
      const evs = TREND.events || [];
      if (evs.some(e => e.kind !== 'event')) legend.push(['Baiting', TR_OPERATION, 'tick']);
      if (evs.some(e => e.kind === 'event')) legend.push(['Cyclone or flood', cssVar('--caption'), 'tick']);

      // drawn at its own size, not the card's: room for a frame and axis titles
      const W = 760, H = 430;
      const { s } = trendChartMarkup(W, H, true);
      const src = resolveVars(
        `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"
           viewBox="0 0 ${W} ${H}" font-family="'Source Sans 3', Arial, sans-serif">${s}</svg>`);
      const img = new Image();
      await new Promise((ok, fail) => {
        img.onload = ok; img.onerror = fail;
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
      });

      // A PNG has no hover, so the operations are listed underneath instead —
      // grouped by toxin in first-use order, each with the months it was used.
      const keyLines = (() => {
        const groups = new Map();
        evs.forEach(e => {
          const bucket = e.kind === 'event' ? 'EVENT' : 'BAIT';
          const k = bucket + '|' + e.label;
          if (!groups.has(k)) groups.set(k, { bucket, label: e.label, when: [] });
          groups.get(k).when.push(monthLabel(e.date));
        });
        const phrase = g => `${g.label} ${g.when.join(', ')}`;
        const out = [];
        const bait = [...groups.values()].filter(g => g.bucket === 'BAIT');
        const events = [...groups.values()].filter(g => g.bucket === 'EVENT');
        if (bait.length) out.push('Baiting: ' + bait.map(phrase).join(' · ') + '.');
        if (events.length) out.push('Recorded: ' + events.map(phrase).join(' · ') + '.');
        return out;
      })();

      const S = 2, pad = 22, chartY = 92;   // laid out in CSS px, drawn at 2x
      const cv = document.createElement('canvas');
      const probe = cv.getContext('2d');
      probe.font = "11px 'Source Sans 3', Arial, sans-serif";
      // wrap the key to the canvas width before the height is fixed
      const wrapped = [];
      keyLines.forEach(line => {
        let current = '';
        line.split(' ').forEach(word => {
          const next = current ? current + ' ' + word : word;
          if (current && probe.measureText(next).width > W) { wrapped.push(current); current = word; }
          else current = next;
        });
        if (current) wrapped.push(current);
      });
      const footH = 44 + wrapped.length * 14 + (wrapped.length ? 6 : 0);
      cv.width = (W + pad * 2) * S;
      cv.height = (chartY + H + footH) * S;
      const c = cv.getContext('2d');
      c.scale(S, S);
      c.fillStyle = '#ffffff';
      c.fillRect(0, 0, cv.width, cv.height);

      c.fillStyle = cssVar('--forest');
      c.font = "700 10px 'Source Sans 3', Arial, sans-serif";
      c.letterSpacing = '1.4px';
      c.fillText('TŌTARA RESERVE · FIVE-MINUTE BIRD COUNTS', pad, 26);
      c.letterSpacing = '0px';
      c.fillStyle = cssVar('--navy');
      c.font = "600 21px 'Source Serif 4', Georgia, serif";
      c.fillText(title, pad, 54);

      let x = pad;
      c.font = "12px 'Source Sans 3', Arial, sans-serif";
      legend.forEach(([label, colour, mark]) => {
        c.strokeStyle = c.fillStyle = colour;
        if (mark === 'dash') {
          c.setLineDash([4, 3]); c.lineWidth = 2;
          c.beginPath(); c.moveTo(x, 72); c.lineTo(x + 15, 72); c.stroke();
          c.setLineDash([]); x += 20;
        } else if (mark === 'tick') {
          c.lineWidth = 2;
          c.beginPath(); c.moveTo(x + 3, 66); c.lineTo(x + 3, 77); c.stroke();
          x += 9;
        } else {
          c.beginPath(); c.arc(x + 5, 72, 5, 0, Math.PI * 2); c.fill(); x += 15;
        }
        c.fillStyle = cssVar('--muted');
        c.fillText(label, x, 76);
        x += c.measureText(label).width + 18;
      });

      c.drawImage(img, pad, chartY, W, H);

      c.fillStyle = cssVar('--caption');
      c.font = "11px 'Source Sans 3', Arial, sans-serif";
      const yearSpan = `${TREND.years[0]}–${TREND.years[TREND.years.length - 1]}`;
      c.fillText(`Mean bird count by transect, ${yearSpan}. Rat tracking tunnel index on the right-hand axis.`,
                 pad, chartY + H + 18);
      const gd = new Date(BIO_DATA.generated);
      c.fillText('Horizons Regional Council five-minute bird counts · Updated '
                 + `${gd.getDate()} ${MONTHS[gd.getMonth()]} ${gd.getFullYear()}`,
                 pad, chartY + H + 33);
      wrapped.forEach((line, i) => {
        c.fillText(line, pad, chartY + H + 53 + i * 14);
      });

      const url = cv.toDataURL('image/png');
      const file = ('5MBC ' + title).replace(/[^a-zA-Z0-9 _-]/g, '').trim().replace(/\s+/g, '_');
      win.document.write(`<!doctype html><meta charset="utf-8"><title>${file}</title>
        <body style="margin:0;background:#f0f0f0;font-family:'Source Sans 3',Arial,sans-serif;
          text-align:center;padding:18px">
        <a href="${url}" download="${file}.png" style="display:inline-block;margin-bottom:12px;
          background:${cssVar('--forest')};color:#fff;text-decoration:none;padding:7px 16px;
          border-radius:14px;font-weight:600">Download ${file}.png</a><br>
        <img src="${url}" style="max-width:100%;box-shadow:0 2px 12px rgba(0,0,0,.15)">
        </body>`);
      win.document.close();
    }

    // ── iNaturalist groups ────────────────────────────────────────────────────
    function photoStrip(photos) {
      if (!photos || !photos.length) return '';
      return `<div class="photos">${photos.map(p => `
        <a class="photo" href="${esc(p.obs)}" target="_blank" rel="noopener"
           title="${esc(p.name)}${p.sci && p.sci !== p.name ? ' (' + esc(p.sci) + ')' : ''} — © ${esc(p.credit)}, ${esc(p.licence)}, via iNaturalist">
          <img src="${esc(p.url)}" alt="${esc(p.name)}" loading="lazy" />
          <span>${esc(p.name)}<small>© ${esc(p.credit)}</small></span>
        </a>`).join('')}</div>`;
    }

    function topList(top) {
      if (!top || !top.length) return '';
      const max = Math.max(...top.map(t => t.count), 1);
      return `
        <div class="sub-label">Most recorded native species</div>
        <div class="top-list fill" data-trim>${top.map(t => `
          <div class="top" title="${esc(t.name)}${t.sci !== t.name ? ' (' + esc(t.sci) + ')' : ''}: ${t.count} sightings">
            <span class="top-name${t.name === t.sci ? ' sci' : ''}">${esc(t.name)}</span>
            <span class="bar"><i style="width:${t.count / max * 100}%"></i></span>
            <span class="num">${t.count}</span>
          </div>`).join('')}</div>`;
    }

    function groupCard(title, g, detailed) {
      // Names only, so all of them fit; the status is on hover
      const threat = detailed && g.threatened && g.threatened.length ? `
        <div class="sub-label">${g.threatened.length} threatened species recorded</div>
        <div class="threat-list">${g.threatened.map(t =>
          `<span class="threat" title="${esc(t.name)} (${esc(t.sci)}): ${esc(t.status)}"><em>!</em> ${esc(t.name)}</span>`).join('')}</div>` : '';
      const stats = detailed ? `
        <div class="stats">
          <div class="stat"><div class="stat-val">${fmt(g.species)}</div><div class="stat-lbl">species</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.native)}</div><div class="stat-lbl">native</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.endemic)}</div><div class="stat-lbl">endemic</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.introduced)}</div><div class="stat-lbl">introduced</div></div>
        </div>` : `
        <div class="stats three">
          <div class="stat"><div class="stat-val">${fmt(g.species)}</div><div class="stat-lbl">species</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.native)}</div><div class="stat-lbl">native</div></div>
          <div class="stat"><div class="stat-val">${fmt(g.endemic)}</div><div class="stat-lbl">endemic</div></div>
        </div>`;
      return `
        <div class="card${detailed ? ' grow' : ''}">
          <div class="card-head">
            <span class="badge">${title} &middot; iNaturalist</span>
            <span class="card-meta">${fmt(g.obs)} sightings</span>
          </div>
          ${stats}
          ${detailed ? topList(g.top) : ''}
          ${threat}
          ${photoStrip(g.photos)}
        </div>`;
    }

    // ── Bats ──────────────────────────────────────────────────────────────────
    // A 24-hour clock with midnight at the top; one bar per hour, length by passes.
    function batClock(byHour) {
      const C = 59, R0 = 19, R1 = 46;
      const max = Math.max(...byHour, 1);
      const ang = h => (h / 24) * 2 * Math.PI - Math.PI / 2;   // 0h at top, 6am right, 6pm left
      const pt = (r, a) => [C + r * Math.cos(a), C + r * Math.sin(a)];
      // Night half (18:00 → 06:00) shaded, which with midnight at the top is the upper half
      const night = `<path d="M${C - R1 - 4},${C} A${R1 + 4},${R1 + 4} 0 0 1 ${C + R1 + 4},${C} Z"
                       fill="var(--forest-lt)"/>`;
      const bars = byHour.map((n, h) => {
        const a0 = ang(h) + 0.03, a1 = ang(h + 1) - 0.03;
        const r = R0 + (n / max) * (R1 - R0);
        if (!n) return '';
        const [x0, y0] = pt(R0, a0), [x1, y1] = pt(r, a0), [x2, y2] = pt(r, a1), [x3, y3] = pt(R0, a1);
        const hh = String(h).padStart(2, '0');
        return `<path d="M${x0},${y0} L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} L${x3},${y3} A${R0},${R0} 0 0 0 ${x0},${y0} Z"
                  fill="var(--forest)" opacity="0.85"><title>${hh}:00–${hh}:59 · ${n} passes</title></path>`;
      }).join('');
      const lbl = (txt, x, y, anchor) =>
        `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="8.5" fill="var(--caption)">${txt}</text>`;
      return `<svg viewBox="0 0 118 118" role="img" aria-label="Bat passes by hour of night">
        ${night}
        <circle cx="${C}" cy="${C}" r="${R0}" fill="var(--surface)" stroke="var(--border)"/>
        <circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="var(--border)" stroke-dasharray="2 2"/>
        ${bars}
        ${lbl('midnight', C, 8, 'middle')}
        ${lbl('6pm', 2, C + 12, 'start')}
        ${lbl('6am', 116, C + 12, 'end')}
        <text x="${C}" y="${C + 3}" text-anchor="middle" font-size="7.5" fill="var(--caption)">by hour</text>
      </svg>`;
    }

    function batCard(bats) {
      const s = bats && bats.surveys && bats.surveys[bats.surveys.length - 1];
      if (!s) return '';
      const from = day(s.from);
      const month = `${FULL_MONTHS[from.getMonth()]} ${from.getFullYear()}`;
      const max = Math.max(...s.byNight.passes, 1);
      const species = Object.keys(s.bySpecies);
      const lt = species.length === 1 && species[0] === 'Long-tailed';
      return `
        <div class="card">
          <div class="card-head">
            <span class="badge">Bats &middot; acoustic monitoring</span>
            <span class="card-meta">${month}</span>
          </div>
          <div class="bat-top">
            <div class="bat-clock">${batClock(s.byHour)}</div>
            <div>
              <div class="bat-big"><b>${fmt(s.passes)}</b><span>bat passes recorded</span></div>
              <div class="bat-sp">${lt ? 'Pekapeka-tou-roa <i>long-tailed bat</i>' : esc(species.join(', '))}</div>
              <div class="bat-facts">
                ${s.recorders.length} recorders &middot; bats on ${s.nightsWithBats} of ${s.nights} nights<br>
                <!-- Milestone from the Tōtara Reserve Annual Report 2025-26 (Bats / Pekapeka) -->
                First confirmed in the reserve in January 2026.
              </div>
            </div>
          </div>
          <div class="nights">
            <div class="night-bars">${s.byNight.passes.map((n, i) =>
              `<i class="${n ? '' : 'zero'}" style="height:${n ? Math.max(n / max * 100, 6) : 4}%"
                  title="Night of ${dayMon(s.byNight.dates[i])}: ${n} passes"></i>`).join('')}</div>
            <div class="night-axis"><span>${dayMon(s.from)}</span><span>passes per night</span><span>${dayMon(s.to)}</span></div>
          </div>
        </div>`;
    }

    // ── Page ──────────────────────────────────────────────────────────────────
    function render() {
      const root = document.getElementById('root');
      const d = BIO_DATA;
      if (!d) { root.innerHTML = '<p class="sub-label">No data yet — run the export script.</p>'; return; }

      const birds  = d.birds.species;
      const native = birds.filter(s => s.status !== 'introduced').length;
      // One species' trend chart needs width more than anything else on the page,
      // so it borrows the plants and fungi column while it is open. The grid view
      // and the other tabs keep the normal three columns.
      const birdWide = !!(TREND && birdTab === 'trend' && trendSel);
      const bat = d.bats && d.bats.surveys && d.bats.surveys[d.bats.surveys.length - 1];
      const gd = new Date(d.generated);
      const gen = `${gd.getDate()} ${MONTHS[gd.getMonth()]} ${gd.getFullYear()}`;
      const tile = (label, val, sub) => `
        <div class="tile">
          <div class="tile-label">${label}</div>
          <div class="tile-val">${val}</div>
          <div class="tile-sub">${sub}</div>
        </div>`;

      root.innerHTML = `
        <div class="head">
          <div class="title-block">
            <a class="eyebrow" href="https://experience.arcgis.com/experience/0b02dc0ca9c545f7bf31fe3ea20ace1a?draft=true" target="_blank" rel="noopener">← Tōtara Reserve</a>
            <h1>Biodiversity</h1>
            <div class="period">Species recorded in and around the reserve</div>
          </div>
          <div class="tiles">
            ${tile('Bird species', birds.length, `${native} native`)}
            ${tile('Plant species', fmt(d.plants.species), `${fmt(d.plants.native)} native`)}
            ${tile('Insect species', fmt(d.insects.species), `${fmt(d.insects.native)} native`)}
            ${tile('Fungi species', fmt(d.fungi.species), `${fmt(d.fungi.native)} native`)}
            ${bat ? tile('Bat passes', fmt(bat.passes),
                `Long-tailed bat &middot; ${MONTHS[day(bat.from).getMonth()]} ${day(bat.from).getFullYear()}`) : ''}
          </div>
        </div>

        <div class="cols${birdWide ? ' bird-wide' : ''}">
          <div class="col">${birdCard(d.birds, d.fiveMbc)}</div>
          ${birdWide ? '' : `
          <div class="col">
            ${groupCard('Plants', d.plants, true)}
            ${groupCard('Fungi', d.fungi, false)}
          </div>`}
          <div class="col">
            ${groupCard('Insects', d.insects, true)}
            ${batCard(d.bats)}
          </div>
        </div>

        <div class="dash-footer">
          <span>Data: eBird &middot; iNaturalist (research grade) &middot; Horizons Regional Council bird counts and bat monitoring</span>
          <span>Updated ${gen}</span>
        </div>`;
      trimToFit();
      drawTrendChart();
    }

    // Drop whole rows from the end of each fill list until it fits its box.
    // Skipped while the frame has no size yet (ExB can mount embeds hidden);
    // the ResizeObserver renders again once it has one.
    // With data-more, a closing "+ N more" line names the dropped rows on hover.
    // Rows marked data-keep are skipped, so the row above them goes instead.
    function trimToFit() {
      document.querySelectorAll('[data-trim]').forEach(list => {
        if (!list.clientHeight) return;
        const over = () => list.scrollHeight > list.clientHeight + 1;
        const dropped = [];
        let more = null;
        while (over() && list.children.length > (more ? 2 : 1)) {
          const row = [...list.children].reverse().find(r => r !== more && !r.hasAttribute('data-keep'));
          if (!row) break;
          dropped.unshift(row.getAttribute('title') || '');
          row.remove();
          if (list.dataset.more && !more) {
            more = document.createElement('div');
            more.className = 'more';
            list.appendChild(more);
          }
          if (more) {
            more.textContent = `+ ${dropped.length} more ${list.dataset.more}`;
            more.title = dropped.map(t => t.split(':')[0]).join('\n');
          }
        }
      });
    }

    document.addEventListener('click', e => {
      if (e.target.closest('[data-export]')) { exportTrendChart(); return; }
      const pick = e.target.closest('[data-trend-sp]');
      if (pick) { trendSel = pick.dataset.trendSp || null; trHideTip(); render(); return; }
      const tab = e.target.closest('[data-bird-tab]');
      if (tab && tab.dataset.birdTab !== birdTab) { birdTab = tab.dataset.birdTab; render(); }
    });

    document.addEventListener('DOMContentLoaded', () => {
      render();
      new ResizeObserver(render).observe(document.getElementById('root'));
      // The web font makes rows a little taller than the fallback font, so lists
      // trimmed before it arrived can overflow — fit them again once it has.
      // fonts.ready alone can resolve before the font has even been requested.
      document.fonts.ready.then(render);
      document.fonts.addEventListener('loadingdone', render);
    });
    window.addEventListener('load', render);
  </script>
</head>
<body data-base-w="1111" data-base-h="687">
  <script src="fit.js?v=1"></script>
  <div id="root"></div>
</body>
</html>
