  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens as predator-control.html */
    :root {
      --navy:       #1f2e35;
      --surface:    #ffffff;
      --border:     #ddddd8;
      --muted:      #5a5a52;
      --caption:    #888880;
      --forest:     #2d6a4f;
      --forest-lt:  #eaf3ee;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--surface);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      padding: 10px 12px 8px;
      gap: 8px;
      overflow: hidden;
    }

    h1 {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.2;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    h2 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caption);
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .species, section { min-width: 0; }

    .species {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .species-list {
      list-style: none;
      overflow-y: auto;
      min-height: 0;
      padding-right: 2px;
    }

    .sp {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      padding: 2px 3px;
      border-radius: 3px;
    }

    .sp:hover { background: var(--forest-lt); }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #1a1a1a;
    }


    .sp-name { color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-n { color: var(--caption); font-size: 0.72rem; font-variant-numeric: tabular-nums; }

    .size-key {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      padding: 0 2px;
    }

    .size-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .size-step span.c {
      display: block;
      border-radius: 50%;
      border: 1px solid #1a1a1a;
      background: #f2f2f0;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .track svg { flex-shrink: 0; }

    .foot { font-size: 0.66rem; color: var(--caption); }
  </style>

<script>
(function () {
  const D = PEST_PLANT_DATA;
  if (!D) return;

  const fmt = n => Number(n).toLocaleString('en-NZ');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const T = D.titles || {};

  if (T.group)  document.getElementById('group-title').textContent  = T.group;
  if (T.points) document.getElementById('points-title').textContent = T.points;
  if (T.tracks) document.getElementById('tracks-title').textContent = T.tracks;

  // Species, most records first. The map shows every year, so counts do too.
  // Only species with a map symbol: the legend describes the map, and species
  // left unsymbolised (e.g. 'Other') are deliberately not shown on it.
  document.getElementById('species-list').innerHTML = D.species.filter(s => s.colour).map(s =>
    `<li class="sp"><span class="dot" style="background:${s.colour}"></span><span class="sp-name">${esc(s.name)}</span><span class="sp-n">${fmt(s.total)}</span></li>`
  ).join('');

  // Size key: same linear scale the map uses (sizeInfo, sizes in points).
  const K = D.sizeKey;
  if (K && K.maxValue) {
    const px = pt => pt * 4 / 3;
    const sizeAt = v => {
      const t = Math.min(1, Math.max(0, (v - K.minValue) / (K.maxValue - K.minValue)));
      return px(K.minSize + t * (K.maxSize - K.minSize));
    };
    const steps = [K.minValue, 100, 250, 400, K.maxValue].filter((v, i, a) => v >= K.minValue && v <= K.maxValue && a.indexOf(v) === i);
    document.getElementById('size-key').innerHTML = steps.map((v, i) => {
      const d = sizeAt(v).toFixed(1);
      const label = i === 0 ? `≤ ${fmt(v)}` : i === steps.length - 1 ? `≥ ${fmt(v)}` : fmt(v);
      return `<div class="size-step"><span class="c" style="width:${d}px;height:${d}px"></span>${label}</div>`;
    }).join('');
  }

  // Track swatch: casing underneath, fill line on top — as the map draws it.
  const tr = D.track || {};
  document.getElementById('track-swatch').innerHTML =
    `<line x1="2" y1="5" x2="32" y2="5" stroke="${tr.casing || '#000'}" stroke-width="3.6" stroke-linecap="round" />` +
    `<line x1="2" y1="5" x2="32" y2="5" stroke="${tr.colour || '#d8d7db'}" stroke-width="1.6" stroke-linecap="round" />`;

  document.getElementById('foot').textContent = `All years, ${D.fys[0]} to ${D.fys[D.fys.length - 1]} · updated ${D.generated}`;
})();
</script>
</body>
</html>
