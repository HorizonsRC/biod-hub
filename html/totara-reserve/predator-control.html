<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predator Control · Tōtara Reserve</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Colours follow the Tōtara Reserve website (totarareserve.co.nz) */
    :root {
      --navy:       #222222;
      --bg:         #f0f0f0;
      --surface:    #ffffff;
      --border:     #dcdcdc;
      --muted:      #515151;
      --caption:    #8a8a8a;

      --forest:     #047f67;
      --forest-lt:  #e2f1ed;

      --safe:       #047f67;
      --caution:    #8b6310;
      --unsafe:     #9b2226;

      /* Species colours — consistent across charts */
      --c0: #c44569;
      --c1: #e07b39;
      --c2: #2d6a4f;
      --c3: #1a535c;
      --c4: #7b68ee;
      --c5: #6c757d;
      --c6: #d4a017;
      --c7: #adb5bd;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      padding: 12px 16px 8px;
      overflow-y: auto;
    }

    /* ── LAYOUT: 1111 × 564 embed under the 1111 × 122 header strip ── */
    #root {
      height: 100%;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cols {
      flex: 1;
      display: grid;
      grid-template-columns: 0.85fr 1fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .col > .grow { flex: 1; }

    .chart-card { display: flex; flex-direction: column; gap: 8px; }

    .bait-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chart-note {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* ── SECTION LABELS ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--caption);
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
    }

    /* ── PROGRAMME CARDS ── */
    .programme-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .programme-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      padding: 11px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prog-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--forest);
    }

    .prog-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--navy);
    }

    .prog-total {
      font-size: 1.55rem;
      font-weight: 300;
      color: var(--navy);
      line-height: 1;
    }

    .prog-total-unit {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .prog-type-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 0;
    }

    .prog-type-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }

    .prog-type-label {
      color: var(--muted);
      min-width: 0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prog-type-bar-wrap {
      flex: 2;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }

    .prog-type-bar {
      height: 100%;
      background: var(--forest);
      border-radius: 4px;
      opacity: 0.75;
    }

    .prog-type-extra {
      min-width: 34px;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fills-head { display: flex; justify-content: space-between; }

    /* Rows share out the card's spare height rather than leaving a gap below */
    .prog-type-list.spread { flex: 1; justify-content: space-evenly; max-height: 150px; }
    .prog-type-list.spread .prog-type-bar-wrap { height: 10px; }

    .prog-total-line { display: flex; align-items: baseline; gap: 8px; }

    .type-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 12px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .type-chips b { font-weight: 600; color: var(--navy); }

    .prog-type-count {
      font-weight: 600;
      color: var(--navy);
      min-width: 24px;
      text-align: right;
    }

    /* ── CATCHES CHART ── */
    .catches-section { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      padding: 12px 16px 10px;
    }

    /* Charts are drawn to the pixel size of this box, so they fill the card */
    .chart-host { flex: 1; min-height: 120px; position: relative; }
    .chart-host > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

    .catches-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── BAIT STATION ROWS ── */
    .bait-type-rows {
      display: flex;
      flex-direction: column;
      margin-top: 4px;
      flex: 1;
    }

    .bait-type-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .bait-type-row:last-child { border-bottom: none; }

    .bait-type-label {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .bait-type-count {
      font-size: 1.55rem;
      font-weight: 300;
      color: var(--navy);
    }

    /* Possum bait nested breakdown */
    .bait-type-row--group {
      flex-direction: column;
      align-items: stretch;
      padding-bottom: 4px;
    }

    .bait-group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .bait-group-buffer {
      font-size: 0.72rem;
      color: var(--caption);
      font-style: italic;
    }

    .bait-sub-rows { display: flex; flex-direction: column; gap: 2px; }

    .bait-sub-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3px 0 3px 8px;
      border-left: 2px solid var(--border);
    }

    .bait-sub-label { font-size: 0.76rem; color: var(--caption); }

    .bait-sub-count {
      font-size: 1.15rem;
      font-weight: 300;
      color: var(--navy);
    }

    /* ── RTCI SECTION ── */
    .rtci-section { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

    .rtci-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .rtci-card {
      background: var(--bg);
      border-radius: 6px;
      padding: 6px 12px 7px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 10px;
      row-gap: 2px;
    }

    .rtci-card .rtci-label, .rtci-card .rtci-grade { width: 100%; }

    .rtci-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--caption);
    }

    .rtci-val {
      font-size: 1.55rem;
      font-weight: 300;
      line-height: 1;
    }

    .rtci-val.low    { color: var(--safe); }
    .rtci-val.medium { color: var(--caution); }
    .rtci-val.high   { color: var(--unsafe); }

    .rtci-unit  { font-size: 0.75rem; color: var(--muted); }
    .rtci-grade { font-size: 0.78rem; font-weight: 600; margin-top: 2px; }
    .rtci-grade.low    { color: var(--safe); }
    .rtci-grade.medium { color: var(--caution); }
    .rtci-grade.high   { color: var(--unsafe); }
    .rtci-year  { font-size: 0.72rem; color: var(--caption); margin-top: 2px; }

    .rtci-explainer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── DEER / CULLING SECTION ── */
    .deer-section { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

    .deer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
    }

    .deer-stats-row {
      display: flex;
      gap: 0;
    }

    .deer-stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 12px;
      border-right: 1px solid var(--border);
    }

    .deer-stat:first-child { padding-left: 0; }
    .deer-stat:last-child  { border-right: none; }

    .deer-stat-val {
      font-size: 1.55rem;
      font-weight: 300;
      color: var(--navy);
      line-height: 1;
    }

    .deer-stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.2;
    }

    .deer-note {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.45;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .deer-note strong { color: var(--navy); font-weight: 600; }

    /* One row per control operation in the season */
    .deer-log {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 4px 10px;
      align-items: baseline;
      font-size: 0.76rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .deer-when { font-weight: 600; color: var(--navy); white-space: nowrap; }
    .deer-n { font-weight: 600; color: var(--navy); text-align: right; font-variant-numeric: tabular-nums; }

    /* ── FOOTER ── */
    .dash-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--caption);
      padding-top: 6px;
      flex-wrap: wrap;
      gap: 4px;
    }
  </style>

    // ── Helpers ───────────────────────────────────────────────────────────────
    const SP_COLOURS = [
      "var(--c0)","var(--c1)","var(--c2)","var(--c3)",
      "var(--c4)","var(--c5)","var(--c6)","var(--c7)"
    ];

    const MUSTELID_SPECIES = ["Stoat", "Weasel", "Ferret"];

    const TTI_CHART_FROM = "2020-01-01";   // earliest survey drawn on the TTI chart

    // Rat TTI targets (Tōtara Reserve Annual Report 2025-26): below 5% in the bird
    // breeding season, November to February, and below 10% the rest of the year.
    // There is no target for mice.
    const RAT_TTI_BREEDING = 5, RAT_TTI_OTHER = 10;
    function ratTarget(date) {
      const m = new Date(date).getMonth();
      return (m >= 10 || m <= 1) ? RAT_TTI_BREEDING : RAT_TTI_OTHER;
    }

    function ttiClass(v, target) {
      if (v === null || v === undefined || !target) return "";
      return v < target ? "low" : "high";
    }

    function ttiGrade(v, target) {
      if (v === null || v === undefined) return "—";
      if (!target) return "No target set";
      const season = target === RAT_TTI_BREEDING ? "breeding season" : "rest of year";
      return `${v < target ? 'Target met' : 'Above target'} &middot; &lt;${target}% ${season}`;
    }

    // ── Trap type horizontal bars ─────────────────────────────────────────────
    // `extra`, if given, is one short string per row shown in a fourth column.
    function typeBarList(byType, extra) {
      if (!byType || !byType.labels || !byType.labels.length) {
        return '<div style="font-size:0.78rem;color:var(--caption);font-style:italic">No type data yet</div>';
      }
      const max = Math.max(...byType.data, 1);
      return byType.labels.map((lbl, i) => {
        const pct = Math.round((byType.data[i] / max) * 100);
        return `
          <div class="prog-type-row">
            <span class="prog-type-label" title="${lbl}">${lbl}</span>
            <div class="prog-type-bar-wrap">
              <div class="prog-type-bar" style="width:${pct}%"></div>
            </div>
            <span class="prog-type-count">${Number(byType.data[i]).toLocaleString('en-NZ')}</span>
            ${extra ? `<span class="prog-type-extra">${extra[i] ?? ''}</span>` : ''}
          </div>`;
      }).join('');
    }

    // ── Merge Stoat/Weasel/Ferret → Mustelids for display ────────────────────
    function buildDisplaySpecies(species) {
      const nonMus = (species || []).filter(s => !MUSTELID_SPECIES.includes(s));
      const hasMus = MUSTELID_SPECIES.some(s => (species || []).includes(s));
      const display = [...nonMus];
      if (hasMus) {
        const catIdx = display.indexOf("Cat");
        display.splice(catIdx >= 0 ? catIdx + 1 : 0, 0, "Mustelids");
      }
      return display;
    }

    // ── Catches stacked bar chart (SVG) ───────────────────────────────────────
    function catchesChart(catchesByFy, W = 350, H = 208) {
      const fys     = catchesByFy.labels  || [];
      const species = catchesByFy.species || [];
      const data    = catchesByFy.data    || {};

      if (!fys.length || !species.length) {
        return '<p style="font-size:12px;color:var(--caption);padding:12px 0">No catch records available.</p>';
      }

      const displaySp = buildDisplaySpecies(species);

      // Build per-species data; sum mustelids + store breakdown for tooltips
      const stackData = {};
      const musBkdn   = {};  // fi → { Stoat:n, Weasel:n, Ferret:n }
      for (const sp of displaySp) {
        if (sp === "Mustelids") {
          stackData[sp] = fys.map((_, fi) =>
            MUSTELID_SPECIES.reduce((s, ms) => s + ((data[ms] || [])[fi] || 0), 0)
          );
          fys.forEach((_, fi) => {
            musBkdn[fi] = {};
            MUSTELID_SPECIES.forEach(ms => { musBkdn[fi][ms] = (data[ms] || [])[fi] || 0; });
          });
        } else {
          stackData[sp] = fys.map((_, fi) => (data[sp] || [])[fi] || 0);
        }
      }

      // Y scale: max stacked total across all FYs
      let maxVal = 0;
      for (let fi = 0; fi < fys.length; fi++) {
        const total = displaySp.reduce((s, sp) => s + (stackData[sp][fi] || 0), 0);
        maxVal = Math.max(maxVal, total);
      }
      maxVal = Math.max(maxVal, 1);

      const ml = 40, mr = 14, mt = 12, mb = 36;
      const cw = W - ml - mr, ch = H - mt - mb;
      const yOf = v => mt + ch - (v / maxVal) * ch;

      // Y-axis ticks
      const tickStep = maxVal <= 20 ? 5 : maxVal <= 100 ? 20 : maxVal <= 300 ? 50 : 100;
      const ticks = [];
      for (let t = 0; t <= maxVal; t += tickStep) ticks.push(t);

      const yGrids = ticks.map(t => {
        const y = yOf(t);
        return `<line x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}"
                      stroke="var(--border)" stroke-width="1"/>
                <text x="${ml - 5}" y="${y + 3.5}" text-anchor="end"
                      font-size="10" fill="var(--caption)">${t}</text>`;
      }).join('');

      // Stacked bars — one per FY, segments built bottom-up
      const nFy    = fys.length;
      const groupW = cw / nFy;
      const barW   = Math.min(Math.max(groupW * 0.55, 22), 70);
      const barOff = (groupW - barW) / 2;

      const bars = fys.map((fy, fi) => {
        let cumY = 0;
        return displaySp.map((sp, si) => {
          const val = stackData[sp][fi] || 0;
          if (val === 0) return '';
          const yBot = yOf(cumY);
          const yTop = yOf(cumY + val);
          const segH = yBot - yTop;
          cumY += val;
          const x   = ml + fi * groupW + barOff;
          const col = SP_COLOURS[si % SP_COLOURS.length];
          let tip;
          if (sp === "Mustelids") {
            const bd    = musBkdn[fi] || {};
            const parts = MUSTELID_SPECIES
              .filter(ms => (bd[ms] || 0) > 0)
              .map(ms => `${ms}: ${bd[ms]}`);
            tip = `Mustelids · ${fy}: ${val}${parts.length ? ` (${parts.join(', ')})` : ''}`;
          } else {
            tip = `${sp} · ${fy}: ${val}`;
          }
          return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}"
                        width="${barW.toFixed(1)}" height="${Math.max(segH, 1).toFixed(1)}"
                        fill="${col}" opacity="0.85" rx="1">
                    <title>${tip}</title>
                  </rect>`;
        }).join('');
      }).join('');

      // X-axis FY labels
      const xLabels = fys.map((fy, fi) => {
        const x = ml + fi * groupW + groupW / 2;
        return `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle"
                      font-size="11" fill="var(--muted)">${fy}</text>`;
      }).join('');

      return `
        <svg viewBox="0 0 ${W} ${H}">
          ${yGrids}
          ${bars}
          ${xLabels}
        </svg>`;
    }

    // ── TTI line chart ────────────────────────────────────────────────────────
    function ttiChart(tti, W = 350, H = 275) {
      if (!tti || !tti.history || !tti.history.dates || !tti.history.dates.length) {
        return '<p style="font-size:12px;color:var(--caption);padding:12px 0">No history data available.</p>';
      }
      // Chart from 2020 on; the full history stays in the data block.
      const keep    = tti.history.dates.map((s, i) => s >= TTI_CHART_FROM ? i : -1).filter(i => i >= 0);
      const dates   = keep.map(i => new Date(tti.history.dates[i]));
      const ratVals = keep.map(i => tti.history.rat[i]);
      const mouVals = keep.map(i => tti.history.mouse[i]);
      const n = dates.length;

      const ml = 40, mr = 14, mt = 20, mb = 40;
      const cw = W - ml - mr, ch = H - mt - mb;

      const allV   = [...ratVals, ...mouVals].filter(v => v !== null && v !== undefined);
      const maxVal = Math.max(...allV, RAT_TTI_OTHER) * 1.1;
      // Spaced by date, so gaps between surveys show as gaps
      const t0 = dates[0].getTime(), span = Math.max(dates[n - 1].getTime() - t0, 1);
      const xAt = t => ml + ((t - t0) / span) * cw;
      const xOf = i => n > 1 ? xAt(dates[i].getTime()) : ml + cw / 2;
      const yOf    = v => mt + ch - (v / maxVal) * ch;

      const tickStep = maxVal <= 20 ? 5 : maxVal <= 60 ? 10 : 25;
      const ticks = [];
      for (let t = 0; t <= Math.ceil(maxVal / tickStep) * tickStep; t += tickStep) ticks.push(t);

      const yGrids = ticks.map(t => {
        const y = yOf(t);
        return `<line x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
                <text x="${ml - 5}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--caption)">${t}%</text>`;
      }).join('');

      // Rat targets as dashed lines. Too close together to label in the chart, so the
      // legend names them and each line's value shows on hover.
      const targets = [[RAT_TTI_BREEDING, 'Rat target 5%, Nov–Feb'], [RAT_TTI_OTHER, 'Rat target 10%, rest of year']].map(([v, lbl]) => {
        const y = yOf(v);
        return `<line x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}" stroke="var(--c0)" stroke-width="1.5"
                      stroke-dasharray="5 3" opacity="0.7"><title>${lbl}</title></line>`;
      }).join('');

      function makeLine(vals, col) {
        let d = '', seg = false;
        for (let i = 0; i < n; i++) {
          if (vals[i] !== null && vals[i] !== undefined) {
            d += seg ? `L${xOf(i).toFixed(1)},${yOf(vals[i]).toFixed(1)} `
                     : `M${xOf(i).toFixed(1)},${yOf(vals[i]).toFixed(1)} `;
            seg = true;
          } else { seg = false; }
        }
        return d ? `<path d="${d}" stroke="${col}" stroke-width="2" fill="none" opacity="0.85"/>` : '';
      }

      function makeDots(vals, col, label) {
        return vals.map((v, i) => {
          if (v === null || v === undefined) return '';
          const dt = dates[i].toLocaleDateString('en-NZ', {year:'numeric', month:'short'});
          return `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="3"
                          fill="${col}" opacity="0.85">
                    <title>${label} · ${dt}: ${v}%</title>
                  </circle>`;
        }).join('');
      }

      // A tick and label at each 1 January inside the range
      const xLabels = [];
      for (let yr = dates[0].getFullYear() + 1; yr <= dates[n - 1].getFullYear(); yr++) {
        const x = xAt(new Date(yr, 0, 1).getTime());
        xLabels.push(`<line x1="${x.toFixed(1)}" y1="${mt + ch}" x2="${x.toFixed(1)}" y2="${mt + ch + 4}" stroke="var(--border)" stroke-width="1"/>
          <text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--caption)">${yr}</text>`);
      }

      return `<svg viewBox="0 0 ${W} ${H}">
        ${yGrids}
        ${targets}
        ${makeLine(ratVals, 'var(--c0)')}
        ${makeLine(mouVals, 'var(--c3)')}
        ${makeDots(ratVals, 'var(--c0)', 'Rat TTI')}
        ${makeDots(mouVals, 'var(--c3)', 'Mouse TTI')}
        ${xLabels.join('')}
      </svg>`;
    }

    // ── Legend (with Mustelid grouping) ──────────────────────────────────────
    function catchesLegend(species) {
      const displaySp = buildDisplaySpecies(species);
      return displaySp.map((sp, i) => `
        <div class="legend-item">
          <div class="legend-dot" style="background:${SP_COLOURS[i % SP_COLOURS.length]}"></div>
          <span>${sp}</span>
        </div>`).join('');
    }

    // ── Main render ───────────────────────────────────────────────────────────
    function render() {
      const d   = PCO_DATA;
      // "28 Sep 2026", same style as the pest plant pages
      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const gd  = d.generated ? new Date(d.generated) : null;
      const gen = gd ? `${gd.getDate()} ${MONTHS[gd.getMonth()]} ${gd.getFullYear()}` : '—';
      const pb = d.possumBait || {};
      const pRes = pb.withinReserve !== null && pb.withinReserve !== undefined ? pb.withinReserve : '—';
      // Fill records per FY, summed across whatever the fill field's values are
      const pf = pb.fills || {};
      const pFills = {
        labels: pf.labels || [],
        data: (pf.labels || []).map((_, i) =>
          Object.values(pf.fillCounts || {}).reduce((s, arr) => s + (arr[i] || 0), 0)),
      };

      // Bait take: share of fill visits where some or all bait had gone
      const br = pb.baitRemaining || {};
      const pTake = pFills.labels.map(fy => {
        const i = (br.labels || []).indexOf(fy);
        if (i < 0) return '';
        const n = br.all[i] + br.half[i] + br.none[i];
        return n ? Math.round((br.half[i] + br.none[i]) / n * 100) + '%' : '';
      });
      const tc = d.trapChecksByFy || { labels: [], data: [] };

      document.getElementById('root').innerHTML = `

        <div class="cols">
          <div class="col">
          <div class="programme-card">
            <div class="prog-badge">Animal trapping</div>
            <div class="prog-total-line">
              <span class="prog-total">${d.bioTotara.total || '—'}</span>
              <span class="prog-total-unit">traps installed</span>
            </div>
            <div class="type-chips">${(d.bioTotara.byType.labels || []).map((l, i) =>
              `<span>${l} <b>${d.bioTotara.byType.data[i]}</b></span>`).join('')}</div>
            <div class="bait-sub-label" style="margin-top:2px">Trap checks by financial year</div>
            <div class="prog-type-list">${typeBarList(tc)}</div>
          </div>
          <div class="programme-card grow">
            <div class="prog-badge">Bait Stations</div>
            <div class="bait-pair">
              <div>
                <div class="prog-total">${d.vespex.total || '—'}</div>
                <div class="prog-total-unit">Vespex Bait Stations</div>
              </div>
              <div>
                <div class="prog-total">${pRes}</div>
                <div class="prog-total-unit">Possum Bait Stations</div>
              </div>
            </div>
            <div class="bait-sub-label fills-head" style="margin-top:2px">
              <span>Possum bait fills by financial year</span><span>take</span>
            </div>
            <div class="prog-type-list spread">${typeBarList(pFills, pTake)}</div>
            <div class="chart-note" style="margin-top:auto">Take: share of visits where some or all bait had gone.</div>
          </div>
          </div>

          <div class="col">
          <div class="chart-card grow">
            <div class="prog-badge">Animal Pest Catches &middot; By Financial Year</div>
            <div class="catches-legend">${catchesLegend(d.catchesByFy.species)}</div>
            <div class="chart-host" id="catches-host"></div>
          </div>

          <div class="programme-card">
            <!-- Hand-entered from the Tōtara Reserve Annual Report 2025-26, Table 4
                 (77 hrs, 19 deer); the June sighting note is from the contractor's Deer
                 Control Operational Report 2026. No data feed. -->
            <div class="prog-badge">Deer Control &middot; 2025-26</div>
            <div class="deer-stats-row">
              <div class="deer-stat">
                <div class="deer-stat-val">19</div>
                <div class="deer-stat-label">Deer culled</div>
              </div>
              <div class="deer-stat">
                <div class="deer-stat-val">18</div>
                <div class="deer-stat-label">Fallow</div>
              </div>
              <div class="deer-stat">
                <div class="deer-stat-val">1</div>
                <div class="deer-stat-label">Red</div>
              </div>
            </div>
            <div class="deer-log">
              <span class="deer-when">2025-26</span>
              <span>Horizons staff &middot; 7 hrs</span>
              <span class="deer-n">7</span>
              <span class="deer-when">Jun 2026</span>
              <span>Contractor &middot; night shooting + day hunt, 70 hrs</span>
              <span class="deer-n">12</span>
            </div>
            <div class="deer-note">
              About 15 more seen in June but not shot. Deer move in and out along the river corridor.
            </div>
          </div>
          </div>

          <div class="col">
          <div class="chart-card grow">
            <div class="prog-badge">Rodent Tracking Tunnel Index</div>
            ${(() => {
              const t = d.tti;
              if (!t || !t.latest) return '<div class="chart-note" style="font-style:italic">Tracking tunnel data not yet loaded — run script to update.</div>';
              const rPct  = t.latest.rat   !== null && t.latest.rat   !== undefined ? t.latest.rat   : null;
              const mPct  = t.latest.mouse !== null && t.latest.mouse !== undefined ? t.latest.mouse : null;
              const rTgt  = t.latest.date ? ratTarget(t.latest.date) : null;
              const rCls  = ttiClass(rPct, rTgt);
              const mCls  = ttiClass(mPct, null);
              const lDate = t.latest.date ? new Date(t.latest.date).toLocaleDateString('en-NZ', { month: 'short', year: 'numeric' }) : '';
              return `
                <div class="rtci-row">
                  <div class="rtci-card">
                    <div class="rtci-label">Rat TTI &middot; ${lDate}</div>
                    <div class="rtci-val ${rCls}">${rPct !== null ? rPct + '%' : '—'}</div>
                    <div class="rtci-grade ${rCls}">${ttiGrade(rPct, rTgt)}</div>
                  </div>
                  <div class="rtci-card">
                    <div class="rtci-label">Mouse TTI &middot; ${lDate}</div>
                    <div class="rtci-val ${mCls}">${mPct !== null ? mPct + '%' : '—'}</div>
                    <div class="rtci-grade ${mCls}">${ttiGrade(mPct, null)}</div>
                  </div>
                </div>
                <div class="catches-legend" style="margin-bottom:0">
                  <div class="legend-item"><div class="legend-dot" style="background:var(--c0)"></div><span>Rat</span></div>
                  <div class="legend-item"><div class="legend-dot" style="background:var(--c3)"></div><span>Mouse</span></div>
                  <div class="legend-item"><svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4"
                    stroke="var(--c0)" stroke-width="1.5" stroke-dasharray="5 3"/></svg><span>Rat targets (5% / 10%)</span></div>
                </div>
                <div class="chart-host" id="tti-host"></div>`;
            })()}
            <div class="chart-note">
              <strong style="color:var(--navy)">What is TTI?</strong>
              The Tracking Tunnel Index measures rodent activity — the percentage of tracking tunnels
              showing rat or mouse footprints after a 24-hour exposure.
              Rat targets: <strong style="color:var(--navy)">below 5%</strong> in the bird breeding
              season (Nov–Feb) and <strong style="color:var(--navy)">below 10%</strong> the rest of the year.
            </div>
          </div>
          </div>
        </div>

        <div class="dash-footer">
          <span>Data: Horizons Regional Council</span>
          <span>Updated ${gen}</span>
        </div>
      `;
    }

    // Draw each chart at its box's real size, so the x-axis sits at the foot of
    // the card whatever height the embed gives it.
    function drawCharts() {
      const d = PCO_DATA;
      for (const [id, draw] of [
        ['catches-host', (w, h) => catchesChart(d.catchesByFy, w, h)],
        ['tti-host',     (w, h) => ttiChart(d.tti, w, h)],
      ]) {
        const host = document.getElementById(id);
        if (host) host.innerHTML = draw(Math.round(host.clientWidth), Math.round(host.clientHeight));
      }
    }

    document.addEventListener('DOMContentLoaded', () => { render(); drawCharts(); });
    window.addEventListener('resize', drawCharts);
  </script>
</head>
<body data-base-w="1111" data-base-h="592">
  <script src="fit.js?v=1"></script>
  <div id="root"></div>
</body>
</html>
