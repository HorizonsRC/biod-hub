<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campground · Tōtara Reserve</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens as predator-control.html */
    :root {
      --navy:       #222222;
      --bg:         #f0f0f0;
      --surface:    #ffffff;
      --border:     #dcdcdc;
      --muted:      #515151;
      --caption:    #8a8a8a;
      --forest:     #047f67;
      --forest-lt:  #e2f1ed;
      --lime:       #86be3d;   /* the website's "Book online" green */

      /* The campground's charging age groups */
      --adults:     #047f67;
      --children:   #86be3d;
      --infants:    #e07b39;
      --prev:       #b4b4b4;   /* the previous season, behind the selected one */
    }

    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--navy);
      padding: 12px 16px 8px;
      position: relative;
    }

    /* ── LAYOUT: one embed filling the whole ExB page, 1111 × 687 ── */
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .head { display: flex; gap: 12px; flex: 0 0 92px; }

    /* Grows with the season buttons so they stay on one line */
    .title-block {
      flex: 0 0 auto;
      min-width: 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--forest);
    }

    /* Back link to the app's Main Page */
    a.eyebrow { text-decoration: none; align-self: flex-start; }
    a.eyebrow:hover { text-decoration: underline; }

    h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.1;
    }

    /* Season picker: drives the tiles, the daily chart and the site categories */
    .seasons { display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 2px; }
    .season-btn {
      font: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .season-btn:hover { border-color: var(--forest); color: var(--forest); }
    .season-btn.on { background: var(--forest); border-color: var(--forest); color: #fff; }

    .tiles {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .tile, .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--forest);
      border-radius: 6px;
      min-width: 0;
    }

    .tile {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .tile-label, .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tile-label { color: var(--caption); }
    .badge { color: var(--forest); }

    .tile-val {
      font-size: 1.75rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .tile-sub { font-size: 0.72rem; color: var(--caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .card {
      padding: 11px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .head-right { display: flex; align-items: center; gap: 14px; }

    /* Same idea as the Pressure Management charts' Export PNG button */
    .export-btn {
      font: inherit;
      font-size: 0.72rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      align-self: center;
    }
    .export-btn:hover { border-color: var(--forest); color: var(--forest); }
    .card-sub { font-size: 0.74rem; color: var(--caption); }

    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .legend-item[data-season] { cursor: pointer; }
    .legend-item.on { color: var(--navy); font-weight: 600; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .swatch.line { height: 3px; width: 14px; border-radius: 2px; }

    /* Charts are drawn to the pixel size of this box, so they fill the card */
    .chart-host { flex: 1; min-height: 80px; position: relative; }
    .chart-host > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

    /* ── SITE CATEGORIES ── */
    .cat-list { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 4px; min-height: 0; }
    .cat-row { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; align-items: baseline; }
    .cat-name { font-size: 0.8rem; font-weight: 600; }
    .cat-val { font-size: 0.95rem; font-weight: 300; font-variant-numeric: tabular-nums; text-align: right; }
    .cat-bar-wrap { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .cat-bar { height: 100%; background: var(--forest); border-radius: 4px; }
    .cat-meta { grid-column: 1 / -1; font-size: 0.72rem; color: var(--caption); font-variant-numeric: tabular-nums; }

    .dash-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--caption);
      flex-wrap: wrap;
      gap: 4px;
    }

    /* ── TOOLTIP ── */
    #tip {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 6px 9px;
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.45;
      white-space: nowrap;
      display: none;
      font-variant-numeric: tabular-nums;
    }
    #tip b { color: var(--navy); font-weight: 600; }
    #tip .row { display: flex; align-items: center; gap: 6px; }
  </style>

    /* CAMP_DATA_END */

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    // Data's monthly arrays run July → June
    const SEASON_MONTHS = ['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun'];
    const AGES = [
      ['adults',   'Adults',            'var(--adults)'],
      ['children', 'Children 5–18',     'var(--children)'],
      ['infants',  'Children under 5',  'var(--infants)'],
    ];
    const DAY_MS = 864e5;

    // Events marked on the daily chart, hand-entered. `until` (optional) shades
    // the days the event affected. Shown when they fall in the selected season.
    const EVENTS = [
      { date: '2023-02-13', until: '2023-04-30', label: 'Cyclone Gabrielle',
        note: 'No guests for the rest of the season' },
      { date: '2026-02-15', until: '2026-02-21', label: 'Extreme weather',
        note: 'Reserve closed for seven days; Kahikatea camping area shut for the rest of the season' },
    ];

    let SEL = null;   // selected season label
    let EXPORTS = {}; // chart host id → title, file name and legend for its PNG

    const EXPORT_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
    const exportBtn = id => `<button class="export-btn" data-export="${id}" title="Download as PNG">${EXPORT_ICON}Export PNG</button>`;

    const fmt = n => Number(n).toLocaleString('en-NZ');
    const day = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    const diffDays = (a, b) => Math.round((a - b) / DAY_MS);
    const longDate = d => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    const seasonYear = label => 2000 + Number(label.slice(0, 2));

    // Older seasons light, newest darkest: one hue, so order reads as time
    function seasonColour(i, n) {
      if (n <= 1) return '#047f67';
      const a = [127, 191, 172], b = [3, 79, 64];   // #7fbfac → #034f40
      const t = i / (n - 1);
      return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',')})`;
    }

    // Round an axis maximum up to 1, 2, 2.5 or 5 × a power of ten
    function niceStep(v) {
      const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
      return [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= v);
    }
    function niceScale(max, ticks = 4) {
      const step = niceStep(Math.max(max, 1) / ticks);
      return { step, top: Math.ceil(Math.max(max, 1) / step) * step };
    }

    function yGrid(scale, yOf, ml, x2) {
      let out = '';
      for (let t = 0; t <= scale.top; t += scale.step) {
        const y = yOf(t).toFixed(1);
        out += `<line x1="${ml}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
                <text x="${ml - 6}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--caption)">${fmt(t)}</text>`;
      }
      return out;
    }

    // ── Tooltip ───────────────────────────────────────────────────────────────
    // The page is scaled by fit.js, so mouse coordinates are divided by its scale.
    const scaleNow = () => (window.fitScale ? window.fitScale() : 1);
    function showTip(e, html) {
      const tip = document.getElementById('tip');
      tip.innerHTML = html;
      tip.style.display = 'block';
      const s = scaleNow();
      const bw = document.body.clientWidth, bh = document.body.clientHeight;
      let x = e.clientX / s + 14, y = e.clientY / s + 12;
      if (x + tip.offsetWidth > bw - 4) x = e.clientX / s - tip.offsetWidth - 14;
      if (y + tip.offsetHeight > bh - 4) y = e.clientY / s - tip.offsetHeight - 12;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }
    const hideTip = () => { document.getElementById('tip').style.display = 'none'; };
    const localX = (e, el) => (e.clientX - el.getBoundingClientRect().left) / scaleNow();

    // ── Daily guests, selected season over the one before ────────────────────
    function dailyChart(host, s, prev) {
      const W = host.clientWidth, H = host.clientHeight;
      const ml = 42, mr = 10, mt = 8, mb = 22;
      const cw = W - ml - mr, ch = H - mt - mb;
      const oct1 = new Date(seasonYear(s.season), 9, 1);
      const from = day(s.from);
      // The previous season, shifted a year so the same calendar day lines up
      const prevOct1 = prev ? new Date(seasonYear(prev.season), 9, 1) : null;
      const shift = d => addDays(oct1, diffDays(d, prevOct1));

      // Axis runs from the first night with guests to the last, in either
      // season, so the closed weeks either side don't show as a flat line.
      // A season under way keeps the previous season's end, so it shows how
      // much of the season is still to come.
      const busy = [];
      s.daily.forEach((v, i) => { if (v > 0) busy.push(addDays(from, i)); });
      if (prev) prev.daily.forEach((v, i) => { if (v > 0) busy.push(shift(addDays(day(prev.from), i))); });
      const d0 = busy.length ? addDays(new Date(Math.min(...busy)), -1) : from;
      const d1 = busy.length ? addDays(new Date(Math.max(...busy)), 1) : day(s.to);
      const nDays = Math.max(diffDays(d1, d0), 1);
      const xOf = d => ml + diffDays(d, d0) / nDays * cw;
      const prevAt = d => {
        if (!prev) return null;
        const i = diffDays(addDays(prevOct1, diffDays(d, oct1)), day(prev.from));
        return i >= 0 && i < prev.daily.length ? prev.daily[i] : null;
      };
      const curAt = d => {
        const i = diffDays(d, from);
        return i >= 0 && i < s.daily.length ? s.daily[i] : null;
      };

      const prevPts = [];
      for (let k = 0; k <= nDays; k++) {
        const d = addDays(d0, k), v = prevAt(d);
        if (v !== null) prevPts.push([xOf(d), v]);
      }
      const max = Math.max(...s.daily, ...prevPts.map(p => p[1]), 1);
      const sc = niceScale(max);
      const yOf = v => mt + ch - v / sc.top * ch;

      const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${yOf(p[1]).toFixed(1)}`).join('');
      const cur = s.daily
        .map((v, i) => [addDays(from, i), v])
        .filter(([d]) => d >= d0 && d <= d1)
        .map(([d, v]) => [xOf(d), v]);
      const area = cur.length
        ? `${path(cur)}L${cur[cur.length - 1][0].toFixed(1)},${yOf(0).toFixed(1)}L${cur[0][0].toFixed(1)},${yOf(0).toFixed(1)}Z`
        : '';

      // A tick at the first of each month, each label centred on its month.
      // The axis starts mid-month, so the first month gets a label of its own.
      let ticks = '';
      const firstTick = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
      if (Math.min(xOf(firstTick), xOf(d1)) - xOf(d0) > 22) {
        ticks += `<text x="${((xOf(d0) + Math.min(xOf(firstTick), xOf(d1))) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--caption)">${MONTHS[d0.getMonth()]}</text>`;
      }
      for (let m = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); m <= d1; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
        const x = xOf(m).toFixed(1), xn = Math.min(xOf(new Date(m.getFullYear(), m.getMonth() + 1, 1)), xOf(d1));
        ticks += `<line x1="${x}" y1="${mt + ch}" x2="${x}" y2="${mt + ch + 4}" stroke="var(--caption)" stroke-width="1"/>`;
        if (xn - xOf(m) > 22) {
          ticks += `<text x="${((+x + xn) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--caption)">${MONTHS[m.getMonth()]}</text>`;
        }
      }

      // Events in this season: a line on the day, a shaded band for its effect
      const events = EVENTS
        .map(ev => ({ ...ev, d: day(ev.date), u: ev.until ? day(ev.until) : day(ev.date) }))
        .filter(ev => ev.d >= d0 && ev.d <= d1);
      const eventSvg = events.map(ev => {
        const x = xOf(ev.d), xu = xOf(ev.u > d1 ? d1 : ev.u);
        const flip = x > ml + cw * 0.8;
        return `<rect x="${x.toFixed(1)}" y="${mt}" width="${Math.max(xu - x, 0).toFixed(1)}" height="${ch}" fill="var(--navy)" opacity="0.05"/>
          <line x1="${x.toFixed(1)}" y1="${mt}" x2="${x.toFixed(1)}" y2="${mt + ch}" stroke="var(--navy)" stroke-width="1.25" opacity="0.6"/>
          <text x="${(x + (flip ? -6 : 6)).toFixed(1)}" y="${mt + 11}" text-anchor="${flip ? 'end' : 'start'}" font-size="10.5"
                font-weight="600" fill="var(--navy)" stroke="#fff" stroke-width="3" paint-order="stroke">${ev.label}</text>
          <text x="${(x + (flip ? -6 : 6)).toFixed(1)}" y="${mt + 24}" text-anchor="${flip ? 'end' : 'start'}" font-size="10"
                fill="var(--muted)" stroke="#fff" stroke-width="3" paint-order="stroke">${ev.d.getDate()} ${MONTHS[ev.d.getMonth()]} ${ev.d.getFullYear()}</text>`;
      }).join('');

      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
        ${yGrid(sc, yOf, ml, W - mr)}
        ${eventSvg}
        <line x1="${ml}" y1="${yOf(0)}" x2="${W - mr}" y2="${yOf(0)}" stroke="var(--caption)" stroke-width="1"/>
        ${prevPts.length ? `<path d="${path(prevPts)}" fill="none" stroke="var(--prev)" stroke-width="1.5" stroke-linejoin="round"/>` : ''}
        <path d="${area}" fill="var(--forest)" opacity="0.12"/>
        <path d="${path(cur)}" fill="none" stroke="var(--forest)" stroke-width="2" stroke-linejoin="round"/>
        ${ticks}
        <line class="xh" x1="0" x2="0" y1="${mt}" y2="${mt + ch}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
        <circle class="xd" r="4" fill="var(--forest)" stroke="#fff" stroke-width="2" visibility="hidden"/>
        <rect class="hit" x="${ml}" y="${mt}" width="${cw}" height="${ch}" fill="transparent"/>
      </svg>`;

      const svg = host.querySelector('svg'), xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
      const hit = svg.querySelector('.hit');
      hit.addEventListener('mousemove', e => {
        const k = Math.max(0, Math.min(nDays, Math.round((localX(e, host) - ml) / cw * nDays)));
        const d = addDays(d0, k), x = xOf(d).toFixed(1);
        const v = curAt(d), pv = prevAt(d);
        xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
        if (v !== null) {
          xd.setAttribute('cx', x); xd.setAttribute('cy', yOf(v).toFixed(1)); xd.setAttribute('visibility', 'visible');
        } else xd.setAttribute('visibility', 'hidden');
        const pd = prev ? addDays(prevOct1, diffDays(d, oct1)) : null;
        const ev = events.find(x => d >= x.d && d <= x.u);
        showTip(e, `<b>${longDate(d)}</b><br>
          ${ev ? `<div class="row"><b>${ev.label}</b>${ev.note ? `&nbsp;&middot; ${ev.note}` : ''}</div>` : ''}
          ${v !== null ? `<div class="row"><span class="swatch line" style="background:var(--forest)"></span>${fmt(v)} guests</div>`
                       : `<div class="row">Not counted yet</div>`}
          ${pv !== null ? `<div class="row"><span class="swatch line" style="background:var(--prev)"></span>${fmt(pv)} on ${pd.getDate()} ${MONTHS[pd.getMonth()]} ${pd.getFullYear()}</div>` : ''}`);
      });
      hit.addEventListener('mouseleave', () => {
        hideTip(); xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden');
      });
    }

    // ── Guest nights by month, one line per season ────────────────────────────
    function monthlyChart(host, seasons) {
      const W = host.clientWidth, H = host.clientHeight;
      const ml = 42, mr = 14, mt = 8, mb = 22;
      const cw = W - ml - mr, ch = H - mt - mb;

      // Months any season has guests in, filled in between (normally Oct → Apr)
      const used = [];
      seasons.forEach(s => s.monthly.forEach((v, i) => { if (v > 0) used.push(i); }));
      const first = Math.min(...used), last = Math.max(...used);
      const idx = Array.from({ length: last - first + 1 }, (_, k) => first + k);
      const n = idx.length;
      const xOf = k => ml + (n > 1 ? k / (n - 1) * cw : cw / 2);

      // A season still under way stops at the month it has reached
      const vals = seasons.map(s => {
        const t = day(s.to), reached = (t.getMonth() - 6 + 12) % 12;
        return idx.map(i => (s.inProgress && i > reached) ? null : s.monthly[i]);
      });
      const sc = niceScale(Math.max(...vals.flat().filter(v => v !== null), 1));
      const yOf = v => mt + ch - v / sc.top * ch;

      const lines = seasons.map((s, si) => {
        const on = s.season === SEL, col = seasonColour(si, seasons.length);
        let d = '';
        vals[si].forEach((v, k) => { if (v !== null) d += `${d ? 'L' : 'M'}${xOf(k).toFixed(1)},${yOf(v).toFixed(1)}`; });
        const dots = vals[si].map((v, k) => v === null ? '' :
          `<circle cx="${xOf(k).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${on ? 3.5 : 2.5}" fill="${col}" stroke="#fff" stroke-width="1.5"/>`).join('');
        return { on, svg: `<path d="${d}" fill="none" stroke="${col}" stroke-width="${on ? 3 : 1.75}" stroke-linejoin="round"/>${dots}` };
      });
      // Selected season drawn last, so it sits on top
      const ordered = [...lines.filter(l => !l.on), ...lines.filter(l => l.on)].map(l => l.svg).join('');

      const xLabels = idx.map((i, k) =>
        `<text x="${xOf(k).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--caption)">${SEASON_MONTHS[i]}</text>`).join('');

      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
        ${yGrid(sc, yOf, ml, W - mr)}
        <line x1="${ml}" y1="${yOf(0)}" x2="${W - mr}" y2="${yOf(0)}" stroke="var(--caption)" stroke-width="1"/>
        <line class="xh" x1="0" x2="0" y1="${mt}" y2="${mt + ch}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
        ${ordered}
        ${xLabels}
        <rect class="hit" x="${ml - 10}" y="${mt}" width="${cw + 20}" height="${ch}" fill="transparent"/>
      </svg>`;

      const svg = host.querySelector('svg'), xh = svg.querySelector('.xh'), hit = svg.querySelector('.hit');
      hit.addEventListener('mousemove', e => {
        const k = Math.max(0, Math.min(n - 1, Math.round((localX(e, host) - ml) / (n > 1 ? cw / (n - 1) : 1))));
        const x = xOf(k).toFixed(1);
        xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
        const rows = seasons.map((s, si) => {
          const v = vals[si][k];
          const txt = v === null ? 'not yet' : fmt(v);
          const lbl = `${s.season}${s.inProgress && v !== null ? ' (so far)' : ''}`;
          return `<div class="row"><span class="swatch line" style="background:${seasonColour(si, seasons.length)}"></span>
            ${s.season === SEL ? `<b>${lbl}: ${txt}</b>` : `${lbl}: ${txt}`}</div>`;
        }).reverse().join('');
        showTip(e, `<b>${SEASON_MONTHS[idx[k]]} &middot; guest nights</b>${rows}`);
      });
      hit.addEventListener('mouseleave', () => { hideTip(); xh.setAttribute('visibility', 'hidden'); });
    }

    // ── Guest nights by age group, stacked, one bar per season ────────────────
    function agesChart(host, seasons) {
      const W = host.clientWidth, H = host.clientHeight;
      const ml = 42, mr = 6, mt = 16, mb = 22;
      const cw = W - ml - mr, ch = H - mt - mb;
      const sc = niceScale(Math.max(...seasons.map(s => s.guestNights), 1));
      const yOf = v => mt + ch - v / sc.top * ch;
      const band = cw / seasons.length, bw = Math.min(band * 0.58, 46);

      const bars = seasons.map((s, si) => {
        const x = ml + si * band + (band - bw) / 2;
        const on = s.season === SEL;
        let cum = 0;
        const segs = AGES.map(([key, label, col]) => {
          const v = s[key];
          if (!v) return '';
          const y0 = yOf(cum), y1 = yOf(cum + v);
          cum += v;
          const pct = Math.round(v / s.guestNights * 100);
          // 2px gap between segments
          const h = Math.max(y0 - y1 - 2, 1);
          return `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
                    fill="${col}" opacity="${on ? 1 : 0.55}" rx="2"
                    data-tip="<b>${s.season}${s.inProgress ? ' (so far)' : ''}</b><br>${label}: ${fmt(v)} guest nights (${pct}%)"/>`;
        }).join('');
        const tx = (x + bw / 2).toFixed(1);
        return `${segs}
          <text x="${tx}" y="${(yOf(s.guestNights) - 5).toFixed(1)}" text-anchor="middle" font-size="10"
                font-weight="${on ? 600 : 400}" fill="var(--muted)">${fmt(s.guestNights)}</text>
          <text x="${tx}" y="${H - 6}" text-anchor="middle" font-size="10.5" font-weight="${on ? 700 : 400}"
                fill="${on ? 'var(--navy)' : 'var(--caption)'}">${s.season}</text>`;
      }).join('');

      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
        ${yGrid(sc, yOf, ml, W - mr)}
        ${bars}
      </svg>`;
      const svg = host.querySelector('svg');
      svg.addEventListener('mousemove', e => {
        const t = e.target.getAttribute && e.target.getAttribute('data-tip');
        t ? showTip(e, t) : hideTip();
      });
      svg.addEventListener('mouseleave', hideTip);
    }

    // ── Tiles ─────────────────────────────────────────────────────────────────
    function change(now, before, prevLabel, inProgress, digits = 0) {
      if (before === null || before === undefined) return '';
      const when = inProgress ? `at this point in ${prevLabel}` : `in ${prevLabel}`;
      const r = x => digits ? x.toFixed(digits) : fmt(x);
      if (r(now) === r(before)) return `same as ${when.replace(/^in /, '')}`;
      return now > before ? `▲ up from ${r(before)} ${when}` : `▼ down from ${r(before)} ${when}`;
    }

    function render() {
      const root = document.getElementById('root');
      const d = CAMP_DATA;
      if (!d || !d.seasons || !d.seasons.length) {
        root.innerHTML = '<p class="card-sub">No data yet — run the export script with --only camp.</p>';
        return;
      }
      const seasons = d.seasons;
      if (!SEL || !seasons.some(s => s.season === SEL)) SEL = seasons[seasons.length - 1].season;
      const si = seasons.findIndex(s => s.season === SEL);
      const s = seasons[si], prev = si > 0 ? seasons[si - 1] : null;
      // A season under way is compared with the one before at the same point
      const base = prev ? (s.inProgress && s.prevToDate ? s.prevToDate : prev) : null;
      const stay = x => x.bookings ? x.siteNights / x.bookings : 0;
      const busy = day(s.busiest.date);
      const gd = new Date(d.generated);
      const gen = `${gd.getDate()} ${MONTHS[gd.getMonth()]} ${gd.getFullYear()}`;
      const first = 'First season in Newbook';
      const tile = (label, val, sub) => `
        <div class="tile">
          <div class="tile-label">${label}</div>
          <div class="tile-val">${val}</div>
          <div class="tile-sub" title="${sub}">${sub}</div>
        </div>`;

      // Site categories for the selected season
      const cats = Object.entries(s.byCategory).sort((a, b) => a[0].localeCompare(b[0]));
      const catMax = Math.max(...cats.map(([, c]) => c.guestNights), 1);
      const catRows = cats.map(([name, c]) => `
        <div class="cat-row">
          <span class="cat-name">${name}</span>
          <span class="cat-val">${fmt(c.guestNights)}</span>
          <div class="cat-bar-wrap"><div class="cat-bar" style="width:${(c.guestNights / catMax * 100).toFixed(1)}%"></div></div>
          <span class="cat-meta">${fmt(c.siteNights)} site nights &middot; ${fmt(c.bookings)} bookings &middot; ${Math.round(c.guestNights / s.guestNights * 100)}% of guests</span>
        </div>`).join('');

      const soFar = s.inProgress ? ' so far' : '';
      EXPORTS = {
        'daily-host': {
          title: `Guests each night · ${s.season}${soFar}`,
          file: `Guests_each_night_${s.season}`,
          legend: [{ label: s.season, colour: 'var(--forest)', line: true },
                   ...(prev ? [{ label: prev.season, colour: 'var(--prev)', line: true }] : [])],
        },
        'monthly-host': {
          title: 'Guest nights by month',
          file: 'Guest_nights_by_month',
          legend: seasons.map((x, i) => ({ label: x.season + (x.inProgress ? ' (so far)' : ''),
                                           colour: seasonColour(i, seasons.length), line: true })),
        },
        'ages-host': {
          title: 'Guest nights by age group',
          file: 'Guest_nights_by_age_group',
          legend: AGES.map(([, label, colour]) => ({ label, colour })),
        },
      };
      root.innerHTML = `
        <div class="head">
          <div class="title-block">
            <a class="eyebrow" href="https://experience.arcgis.com/experience/0b02dc0ca9c545f7bf31fe3ea20ace1a?draft=true" target="_blank" rel="noopener">← Tōtara Reserve</a>
            <h1>Campground</h1>
            <div class="seasons">${seasons.map(x =>
              `<button class="season-btn${x.season === SEL ? ' on' : ''}" data-season="${x.season}">${x.season}</button>`).join('')}</div>
          </div>
          <div class="tiles">
            ${tile(`Guest nights &middot; ${s.season}`, fmt(s.guestNights),
                base ? change(s.guestNights, base.guestNights, prev.season, s.inProgress) : first)}
            ${tile('Bookings', fmt(s.bookings),
                base ? change(s.bookings, base.bookings, prev.season, s.inProgress) : first)}
            ${tile('Site nights booked', fmt(s.siteNights),
                base ? change(s.siteNights, base.siteNights, prev.season, s.inProgress) : first)}
            ${tile('Average stay', `${stay(s).toFixed(1)}<span style="font-size:0.9rem"> nights</span>`,
                base ? change(stay(s), stay(base), prev.season, s.inProgress, 1) : first)}
            ${tile(`Busiest night${soFar}`, `${fmt(s.busiest.guests)}<span style="font-size:0.9rem"> guests</span>`, longDate(busy))}
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="card-head">
              <span class="badge">Guests each night &middot; ${s.season}${soFar}</span>
              <div class="head-right">
                <div class="legend">
                  <span class="legend-item on"><span class="swatch line" style="background:var(--forest)"></span>${s.season}</span>
                  ${prev ? `<span class="legend-item"><span class="swatch line" style="background:var(--prev)"></span>${prev.season}</span>` : ''}
                </div>
                ${exportBtn('daily-host')}
              </div>
            </div>
            <div class="chart-host" id="daily-host"></div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="badge">Guest nights by site type &middot; ${s.season}${soFar}</span>
            </div>
            <div class="cat-list">${catRows}</div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="badge">Guest nights by month</span>
              <div class="head-right">
                <div class="legend">${seasons.map((x, i) => `
                  <span class="legend-item${x.season === SEL ? ' on' : ''}" data-season="${x.season}">
                    <span class="swatch line" style="background:${seasonColour(i, seasons.length)}"></span>${x.season}</span>`).join('')}
                </div>
                ${exportBtn('monthly-host')}
              </div>
            </div>
            <div class="chart-host" id="monthly-host"></div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="badge">Guest nights by age group</span>
              ${exportBtn('ages-host')}
            </div>
            <div class="legend">${AGES.map(([, label, col]) =>
              `<span class="legend-item"><span class="swatch" style="background:${col}"></span>${label}</span>`).join('')}</div>
            <div class="chart-host" id="ages-host"></div>
          </div>
        </div>

        <div class="dash-footer">
          <span>Data: Tōtara Reserve campground bookings (Newbook) &middot; A guest night is one person staying one night</span>
          <span>Updated ${gen}</span>
        </div>`;
      drawCharts();
    }

    // ── Export PNG ────────────────────────────────────────────────────────────
    // The chart SVG is copied with its colour variables filled in (a stand-alone
    // image can't see the page's CSS), drawn on a canvas under a title and
    // legend, and opened in a new tab with a download link. ExB blocks
    // downloads straight from an embed, so this is how the Pressure Management
    // charts do it too.
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const resolveVars = s => s.replace(/var\((--[\w-]+)\)/g, (_, n) => cssVar(n) || '#000');

    async function exportChart(id) {
      const host = document.getElementById(id), meta = EXPORTS[id];
      const svg = host && host.querySelector('svg');
      if (!svg || !meta) return;
      hideTip();
      // Opened on the click itself: pop-up blockers allow that, but may not
      // once the image has loaded
      const win = window.open('', '_blank');
      if (!win) { alert('Allow pop-ups for this site to export the chart.'); return; }
      const W = host.clientWidth, H = host.clientHeight;

      const clone = svg.cloneNode(true);
      clone.querySelectorAll('.xh, .xd, .hit').forEach(n => n.remove());
      clone.querySelectorAll('[data-tip]').forEach(n => n.removeAttribute('data-tip'));
      clone.setAttribute('width', W);
      clone.setAttribute('height', H);
      clone.setAttribute('font-family', "'Source Sans 3', Arial, sans-serif");
      const src = resolveVars(new XMLSerializer().serializeToString(clone));
      const img = new Image();
      try {
        await new Promise((ok, fail) => {
          img.onload = ok; img.onerror = fail;
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
        });
      } catch (e) {
        win.close();
        alert('Sorry, the chart could not be turned into an image.');
        return;
      }

      // Layout in CSS px, drawn at 2× so the PNG is sharp
      const S = 2, pad = 20, chartY = 86, footH = 46;
      const w = Math.max(W + pad * 2, 520), h = chartY + H + footH;
      const out = document.createElement('canvas');
      out.width = w * S; out.height = h * S;
      const ctx = out.getContext('2d');
      ctx.scale(S, S);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = cssVar('--forest');
      ctx.font = "700 10px 'Source Sans 3', Arial, sans-serif";
      if ('letterSpacing' in ctx) ctx.letterSpacing = '1.5px';
      ctx.fillText('TŌTARA RESERVE · CAMPGROUND', pad, 30);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

      ctx.fillStyle = cssVar('--navy');
      ctx.font = "600 19px 'Source Serif 4', Georgia, serif";
      ctx.fillText(meta.title, pad, 54);

      // Legend: line or box swatch, then the label
      let x = pad;
      ctx.font = "13px 'Source Sans 3', Arial, sans-serif";
      ctx.textBaseline = 'middle';
      for (const item of meta.legend) {
        ctx.fillStyle = resolveVars(item.colour);
        if (item.line) ctx.fillRect(x, 70, 14, 3);
        else ctx.fillRect(x + 2, 66, 10, 10);
        ctx.fillStyle = cssVar('--muted');
        ctx.fillText(item.label, x + 19, 72);
        x += 19 + ctx.measureText(item.label).width + 16;
      }
      ctx.textBaseline = 'alphabetic';

      ctx.drawImage(img, pad, chartY, W, H);

      const gd = new Date(CAMP_DATA.generated);
      ctx.fillStyle = cssVar('--caption');
      ctx.font = "11px 'Source Sans 3', Arial, sans-serif";
      // Two lines, so it fits under the narrow age-group chart too
      ctx.fillText('Data: Tōtara Reserve campground bookings (Newbook)', pad, chartY + H + 20);
      ctx.fillText(`A guest night is one person staying one night · Updated ${gd.getDate()} ${MONTHS[gd.getMonth()]} ${gd.getFullYear()}`,
                   pad, chartY + H + 36);

      const safe = meta.file.replace(/[^a-zA-Z0-9_-]/g, '');
      const dataUrl = out.toDataURL('image/png');
      win.document.write(`<!DOCTYPE html><html><head><title>${safe}</title></head>
<body style="margin:0;background:#222;display:flex;flex-direction:column;align-items:center;padding:24px;font-family:sans-serif;gap:16px;">
  <a href="${dataUrl}" download="${safe}.png"
     style="background:#047f67;color:#fff;padding:10px 22px;border-radius:6px;text-decoration:none;font-size:15px;font-weight:600;">
    &#8681; Download ${safe}.png
  </a>
  <img src="${dataUrl}" style="max-width:100%;border:1px solid #444;border-radius:4px;">
</body></html>`);
      win.document.close();
    }

    // Draw each chart at its box's real size. Skipped while the frame has no
    // size yet (ExB can mount embeds hidden); the ResizeObserver draws again.
    function drawCharts() {
      const d = CAMP_DATA;
      if (!d || !d.seasons || !d.seasons.length) return;
      const si = d.seasons.findIndex(s => s.season === SEL);
      const hosts = {
        'daily-host':   h => dailyChart(h, d.seasons[si], si > 0 ? d.seasons[si - 1] : null),
        'monthly-host': h => monthlyChart(h, d.seasons),
        'ages-host':    h => agesChart(h, d.seasons),
      };
      for (const [id, draw] of Object.entries(hosts)) {
        const h = document.getElementById(id);
        if (h && h.clientWidth > 0 && h.clientHeight > 0) draw(h);
      }
    }

    document.addEventListener('click', e => {
      const ex = e.target.closest('[data-export]');
      if (ex) { exportChart(ex.dataset.export); return; }
      const b = e.target.closest('[data-season]');
      if (b && b.dataset.season !== SEL) { SEL = b.dataset.season; hideTip(); render(); }
    });

    document.addEventListener('DOMContentLoaded', () => {
      render();
      new ResizeObserver(drawCharts).observe(document.getElementById('root'));
      document.fonts.ready.then(drawCharts);
    });
    window.addEventListener('load', drawCharts);
  </script>
</head>
<body data-base-w="1111" data-base-h="687">
  <script src="fit.js?v=1"></script>
  <div id="root"></div>
  <div id="tip"></div>
</body>
</html>
